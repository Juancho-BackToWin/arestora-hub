<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publicidad · Arestora Hub</title>
<meta name="theme-color" content="#0E192F">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Mismo sistema que tareas.html: azul noche para lo que hay que ver de un vistazo,
   fondo #EAEEF5 para lo que se lee con calma. Tarjetas planas, sin bordes de color. */
:root{color-scheme:light;
--bg:#EAEEF5;--card:#FFFFFF;--ink:#0E192F;--mute:#5B6478;--line:#DCE2EF;--acc:#254D9D;
--night:#0E192F;--night2:#142443;--nline:#22345A;--nacc:#8FB8EC;--nmute:#C9D6EE;
--rojo:#D23B3B;--ambar:#E0A21B;--verde:#2E9E6A;--gris:#9AA3B5}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Poppins,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:860px;margin:0 auto}
header{background:var(--night);color:#fff;padding:24px max(5vw,16px) 26px}
.barra{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.volver,.salir{color:var(--nacc);font-size:14px;font-weight:500;text-decoration:none;background:none;border:0;font-family:inherit;cursor:pointer;padding:6px 0;min-height:32px}
.volver:hover,.salir:hover{text-decoration:underline}
h1{font-size:clamp(22px,5.5vw,30px);line-height:1.1;margin:0 0 6px;font-weight:700;text-wrap:balance}
.act{color:var(--nacc);font-size:14px;margin:0}
.act.viejo{color:#FF9C9C;font-weight:600}
.cifras{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px}
.cifra{background:var(--night2);border-radius:14px;padding:12px 12px 12px 14px;position:relative}
.cifra b{display:block;font-size:clamp(24px,7.4vw,44px);line-height:1.05;font-weight:700;letter-spacing:-.01em}
.cifra b.pend{font-size:clamp(15px,4vw,20px);line-height:1.25;color:var(--nacc)}
.cifra span{display:block;font-size:12.5px;color:var(--nmute);margin-top:4px;line-height:1.3}
.cifra>.q{position:absolute;top:9px;right:9px}
.cifra b{padding-right:16px}
.cifra small{display:block;font-size:11.5px;color:#93A3C2;margin-top:4px}
.resumen{margin:18px 0 0;font-size:15px;color:#E4ECF9;max-width:68ch}
.ok{margin-top:20px;background:var(--night2);border-radius:14px;padding:16px 16px 6px}
.ok h2{margin:0;color:#fff;font-size:16px;display:flex;align-items:baseline;gap:10px}
.ok h2 b{font-size:clamp(30px,9vw,44px);color:var(--nacc);line-height:1}
.ok ul{list-style:none;margin:10px 0 0;padding:0}
.ok li{border-top:1px solid var(--nline);padding:11px 0 12px}
.ok li strong{display:block;color:#fff;font-size:15px;font-weight:600}
.ok li span{display:block;font-size:14px;color:var(--nmute);margin-top:3px}
.ok li em{display:block;font-style:normal;font-size:13px;color:var(--nacc);margin-top:3px}
.ok li i{display:block;font-style:normal;font-size:12.5px;color:#93A3C2;margin-top:6px}
.avisos{margin:16px 0 0;padding:0;list-style:none}
.avisos li{font-size:14px;color:#FFD9A0;padding:6px 0 6px 22px;position:relative}
.avisos li::before{content:"";position:absolute;left:4px;top:13px;width:9px;height:9px;border-radius:50%;background:var(--ambar)}
main{padding:4px max(5vw,16px) 30px}
section{margin-top:26px}
section>h2{font-size:19px;margin:0 0 10px;font-weight:700}
.tarjeta{background:var(--card);border-radius:14px;padding:16px;margin-bottom:10px}
.tarjeta p{margin:0 0 8px}.tarjeta p:last-child{margin-bottom:0}
.camps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:10px}
.camp{background:var(--card);border-radius:14px;padding:14px 16px}
.camp h3{margin:0 0 4px;font-size:16px;font-weight:600;line-height:1.3}
.camp .est{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;background:#E3ECFA;color:var(--acc);margin-bottom:8px}
.camp .est.pausa{background:#EEF0F4;color:var(--mute)}
.camp dl{margin:0;display:grid;gap:6px}
.camp dt{font-size:12px;color:var(--mute)}.camp dd{margin:0;font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tab{font:500 14px Poppins,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:0 16px;min-height:40px;cursor:pointer}
.tab[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.tab:focus-visible,.q:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.periodo{font-size:13px;color:var(--mute);margin:0 0 8px}
/* Resultados: en móvil, una tarjeta por campaña; en pantalla ancha, tabla. */
.res{display:grid;gap:10px}
.rc{background:var(--card);border-radius:14px;padding:14px 16px}
.rc h3{margin:0 0 8px;font-size:15.5px;font-weight:600}
.rc .g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;margin:0}
.rc .m dt{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:4px}
.rc .m dd{margin:0;font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums}
.sem{width:11px;height:11px;border-radius:50%;flex:none;border:0;padding:0;cursor:pointer}
.s-verde{background:var(--verde)}.s-ambar{background:var(--ambar)}.s-rojo{background:var(--rojo)}.s-gris{background:var(--gris)}
@media (min-width:760px){.rc .g{grid-template-columns:repeat(4,minmax(0,1fr))}}
.q{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1px solid #B8C3D8;background:transparent;color:var(--mute);font:600 11px Poppins,sans-serif;cursor:pointer;padding:0;flex:none;position:relative}
.q::after{content:"";position:absolute;inset:-12px}
header .q{border-color:#4A5F88;color:var(--nmute)}
.burbuja{position:absolute;z-index:30;max-width:300px;background:var(--night);color:#fff;font-size:13.5px;line-height:1.45;border-radius:12px;padding:12px 14px;box-shadow:0 8px 24px rgba(14,25,47,.28)}
.burbuja b{display:block;color:var(--nacc);font-size:13px;margin-bottom:3px}
.burbuja .ej{display:block;color:var(--nmute);margin-top:6px;font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--mute);font-weight:500}
.cmp{background:var(--card);border-radius:14px;padding:6px 8px;overflow-x:auto}
.cmp td:first-child{font-weight:500}
.cmp .nota{display:block;font-size:12.5px;color:var(--mute);margin-top:2px}
.linea{list-style:none;margin:0;padding:0}
.linea li{background:var(--card);border-radius:14px;padding:13px 16px;margin-bottom:8px;display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px}
.linea .f{font-size:13px;color:var(--acc);font-weight:600;line-height:1.35}
.linea .t{font-size:15px;font-weight:500}
.linea .w{font-size:13.5px;color:var(--mute);margin-top:3px}
.linea .who{font-size:12.5px;color:var(--mute);margin-top:5px}
.etq{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;margin-top:6px;background:#E3ECFA;color:var(--acc)}
.etq.atn{background:#FCEFD6;color:#8A5A00}
details.leer{background:var(--card);border-radius:14px;padding:4px 16px}
details.leer summary{cursor:pointer;font-weight:600;font-size:16px;min-height:48px;display:flex;align-items:center;list-style:none}
details.leer summary::-webkit-details-marker{display:none}
details.leer summary::after{content:"+";margin-left:auto;font-size:22px;color:var(--acc)}
details.leer[open] summary::after{content:"–"}
.leer h3{font-size:15px;margin:18px 0 8px;color:var(--acc)}
.glos{margin:0;display:grid;gap:10px}
.glos dt{font-weight:600;font-size:14.5px}
.glos dd{margin:2px 0 0;font-size:14px;color:#2C3550}
.glos dd .ej{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.obj{margin:0;padding-left:18px}.obj li{margin-bottom:10px;font-size:14px}
.obj b{font-weight:600}
.vacio{background:var(--card);border-radius:14px;padding:24px;text-align:center;color:var(--mute);margin-top:22px}
.leads{list-style:none;margin:0;padding:0}
.leads li{background:var(--card);border-radius:14px;padding:12px 16px;margin-bottom:8px}
.leads .n{font-size:15.5px;font-weight:600}
.leads .e{font-size:14px;color:#2C3550}
.leads .x{font-size:12.5px;color:var(--mute);margin-top:3px}
.leads .etq{margin-right:4px}
.leads .etq.mal{background:#FBE1E1;color:#9B2323}
.acc{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.btn{font:600 14px Poppins,sans-serif;border:0;border-radius:999px;padding:0 18px;min-height:44px;cursor:pointer;background:var(--acc);color:#fff}
.btn.sec{background:var(--card);color:var(--acc);border:1px solid var(--line)}
.btn:focus-visible{outline:2px solid var(--night);outline-offset:2px}
.copiado{font-size:13.5px;color:var(--verde);align-self:center;font-weight:500}
footer{font-size:12.5px;color:var(--mute);padding:6px max(5vw,16px) 34px}
/* Campañas en directo: lo que hay ahora mismo en Meta, con botones para encender, parar y cambiar presupuesto. */
.vivo-cab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.vivo-cab h2{margin:0}
.vivo-cab small{font-size:13px;color:var(--mute)}
.vc{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.vc.on{background:var(--night);color:#fff}
.vc h3{margin:0 0 6px;font-size:16px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 11px;background:#EEF0F4;color:var(--mute)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gris)}
.pill.verde{background:#DFF3E9;color:#1D6B47}.pill.verde::before{background:var(--verde)}
.pill.ambar{background:#FCEFD6;color:#8A5A00}.pill.ambar::before{background:var(--ambar)}
.pill.rojo{background:#FBE1E1;color:#9B2323}.pill.rojo::before{background:var(--rojo)}
.vc.on .pill.verde{background:#1E4A3A;color:#BFF0D8}
.vc .dat{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;margin:10px 0 0;color:var(--mute)}
.vc.on .dat{color:var(--nmute)}
.vc .dat b{color:var(--ink);font-weight:600}.vc.on .dat b{color:#fff}
.vc .ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.vc .ppto{display:flex;align-items:center;gap:6px}
.vc .ppto input{width:84px;min-height:44px;border-radius:12px;border:1px solid var(--line);font:600 16px Poppins,sans-serif;padding:0 10px;text-align:right;background:#fff;color:var(--ink)}
.vc .ppto span{font-size:14px}
.vc.on .ppto input{border-color:#2B3F66}
.btn.parar{background:#fff;color:var(--rojo);border:1px solid #F1C2C2}
.btn.activar{background:var(--verde)}
.btn.confirmar{background:var(--ambar);color:var(--night)}
.btn:disabled{opacity:.55;cursor:wait}
.vc .msg{font-size:13.5px;margin-top:8px}
.vc .msg.err{color:var(--rojo)}.vc.on .msg.err{color:#FFB3B3}
.vc .msg.bien{color:var(--verde)}.vc.on .msg.bien{color:#9FE3C2}
.vc .hor{font-size:13px;margin-top:8px;color:var(--mute)}.vc.on .hor{color:var(--nacc)}
.vermas{font:500 14px Poppins,sans-serif;background:none;border:0;color:var(--acc);cursor:pointer;padding:8px 0;min-height:40px}
.cambios{font-size:13px;color:var(--mute);margin:6px 0 0;padding-left:18px}
@media (max-width:420px){.cifras{gap:7px}.cifra{padding:10px 9px}.linea li{grid-template-columns:62px minmax(0,1fr);gap:10px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="barra"><a class="volver" href="hub.html">← Volver al Hub</a><button class="salir" id="salir" type="button">Cerrar sesión</button></div>
  <h1>Cuadro de mando de publicidad</h1>
  <p class="act" id="act">Comprobando tu sesión…</p>
  <div class="cifras" id="cifras" hidden></div>
  <p class="resumen" id="resumen"></p>
  <div id="ok"></div>
  <ul class="avisos" id="avisos"></ul>
</header>
<main id="main"><div class="vacio">Cargando…</div></main>
<footer id="pie"></footer>
</div>
<div class="burbuja" id="burbuja" role="tooltip" hidden></div>
<script src="sesion.js"></script>
<script src="banda.js"></script>
<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => (v === null || v === undefined || v === "" || isNaN(Number(v))) ? null : Number(v);
const eur = v => { const n = num(v); return n === null ? null : n.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2}) + " €"; };
const eur0 = v => { const n = num(v); return n === null ? null : n.toLocaleString("es-ES",{maximumFractionDigits:0}) + " €"; };
const pct = v => { const n = num(v); return n === null ? null : n.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2}) + " %"; };
const dec = v => { const n = num(v); return n === null ? null : n.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2}); };
const ent = v => { const n = num(v); return n === null ? null : n.toLocaleString("es-ES"); };
const fecha = s => { if(!s) return ""; const m = /^(\d{4})-(\d{2})(?:-(\d{2}))?/.exec(String(s)); if(!m) return esc(s);
  return m[3] ? `${m[3]}/${m[2]}/${m[1].slice(2)}` : `${m[2]}/${m[1]}`; };
const fechaHora = s => { const d = new Date(s); return isNaN(d) ? esc(s) : d.toLocaleString("es-ES",{timeZone:"Europe/Madrid",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); };
const hace = s => { const h = (Date.now() - new Date(s)) / 36e5; if(isNaN(h)) return "";
  return h < 1 ? `hace ${Math.max(1,Math.round(h*60))} min` : h < 48 ? `hace ${Math.round(h)} h` : `hace ${Math.round(h/24)} días`; };
let D = null;

/* ---------------- Glosario (texto fijo; los ejemplos usan las cifras del momento) ---------------- */
const c1 = () => ((D && D.resultados && D.resultados.periodo_7d && D.resultados.periodo_7d.campanas) || []).find(c => /C1/.test(c.nombre||"")) || {};
const G = {
  gasto:{t:"Gasto",d:"Lo que Meta nos ha cobrado por enseñar los anuncios en ese periodo.",ej:()=>eur(c1().gasto)&&`C1 gastó ${eur(c1().gasto)} en los últimos 7 días.`},
  impresiones:{t:"Impresiones",d:"Veces que un anuncio apareció en una pantalla. Si la misma persona lo ve dos veces, cuenta dos."},
  alcance:{t:"Alcance",d:"Personas distintas que vieron el anuncio al menos una vez."},
  frecuencia:{t:"Frecuencia",d:"Veces que la misma persona ve el anuncio, de media. Por encima de 3,5 el anuncio cansa y hay que renovarlo.",ej:()=>dec(c1().frecuencia)&&`En C1, cada persona lo ha visto ${dec(c1().frecuencia)} veces de media en 7 días.`},
  cpm:{t:"CPM",d:"Lo que cuesta que el anuncio se muestre 1.000 veces. Cuanto más bajo, más gente vemos con el mismo dinero.",ej:()=>eur(c1().cpm)&&`En C1, 1.000 apariciones cuestan ${eur(c1().cpm)}.`},
  clic:{t:"Clic",d:"Cuando alguien pulsa en el anuncio (para abrir el formulario, ver la imagen o ir a la página)."},
  ctr:{t:"CTR",d:"Porcentaje de personas que hacen clic después de ver el anuncio. Con el gestor externo era del 1,01 %.",ej:()=>pct(c1().ctr)&&`En C1, ${pct(c1().ctr)}: unas ${Math.round(num(c1().ctr)*10)} de cada 1.000 personas que lo ven pulsan.`},
  lead:{t:"Lead",d:"Persona que deja sus datos en el formulario del anuncio. Puede ser una empresa interesada o alguien que busca empleo."},
  lead_empresa:{t:"Lead de empresa",d:"Lead que es una empresa interesada, no un candidato buscando empleo. Lo confirma Juancho o María Varela en Odoo. Es el único que cuenta como éxito."},
  cpl:{t:"CPL · coste por lead",d:"Gasto dividido entre leads. Mide volumen, no calidad: un lead barato que busca empleo no vale nada.",ej:()=>eur(c1().cpl)&&`C1: ${eur(c1().gasto)} ÷ ${c1().leads} leads = ${eur(c1().cpl)} por lead.`},
  cple:{t:"Coste por lead de empresa",d:"Gasto dividido solo entre los leads que son empresas. Es la cifra que decide si se escala el presupuesto."},
  aprendizaje:{t:"Fase de aprendizaje",d:"Días en que Meta prueba a quién enseñar el anuncio. Se reinicia al cambiar el público, el presupuesto o los anuncios: por eso no se tocan durante esos días."},
  advantage:{t:"Advantage+ audiencia",d:"Meta amplía el público por su cuenta, buscando a quien más probablemente rellene el formulario, siempre dentro de las zonas que fijamos. Se activó el 14/11."},
  retargeting:{t:"Retargeting",d:"Volver a enseñar anuncios a quien ya nos conoce (por ejemplo, quien interactuó con la página de Facebook)."},
  conjunto:{t:"Conjunto de anuncios",d:"El nivel intermedio de una campaña: ahí se fija a quién se enseñan los anuncios y dónde. Cada campaña nuestra tiene uno."},
  formulario:{t:"Formulario de leads",d:"Formulario que se abre dentro de Facebook o Instagram, sin salir a la web. Es nuestro embudo porque la web aún no tiene el píxel de Meta."},
  pixel:{t:"Píxel de Meta",d:"Código que se pone en la web para que Meta sepa quién la visita. Sin él no se puede hacer retargeting de visitas a la web."},
  campana:{t:"Campaña",d:"Agrupa los anuncios de un mismo objetivo y presupuesto. Tenemos C1 (PAMEE), C2 (FUNDAE) y C3 (retargeting)."},
  presupuesto:{t:"Presupuesto diario",d:"Lo máximo que Meta puede gastar al día en esa campaña. Algún día puede pasarse un poco; Meta lo compensa en la semana."},
  pamee:{t:"PAMEE",d:"El programa de Arestora para reducir el absentismo en la empresa. Lo vende C1. Un cliente PAMEE factura unos 15.000 €."},
  fundae:{t:"FUNDAE",d:"Fundación Estatal para la Formación en el Empleo: gestiona el crédito que cada empresa tiene para formar a su plantilla con bonificación. C2 vende formación bonificable; un cliente FUNDAE factura entre 2.000 y 7.000 €."},
  odoo:{t:"Odoo",d:"El programa comercial de Arestora. Allí entra cada lead de Meta (medio «Grupo Arestora Online: Meta») y allí se ve si es una empresa."},
  semaforo:{t:"Semáforo",d:"Verde: dentro del objetivo. Ámbar: zona de mantener y vigilar. Rojo: fuera del objetivo. Gris: falta el dato. Pulsa cada punto para ver su regla."}
};
const q = k => G[k] ? `<button class="q" type="button" data-g="${k}" aria-label="Qué es ${esc(G[k].t)}">?</button>` : "";

/* ---------------- Reglas del semáforo (las decisiones de Juancho, fijas aquí) ---------------- */
const R = {
  frecuencia: v => v === null ? ["gris","Falta el dato."] : v > 3.5 ? ["rojo","Más de 3,5: el anuncio cansa y hay que renovarlo."] : v > 3 ? ["ambar","Entre 3 y 3,5: preparar una variante del anuncio."] : ["verde","Hasta 3: el público aún no está cansado. Por encima de 3,5 se renueva."],
  cpm: (v, nombre) => !/C2/.test(nombre||"") ? null
     : v === null ? ["gris","Falta el dato."] : v <= 15 ? ["verde","Objetivo tras ampliar el público el 14/11: bajar hacia unos 15 €."] : v <= 25 ? ["ambar","Entre 15 y 25 €: bajando, pero aún lejos de los 15 €."] : ["rojo","Por encima de 25 €: hay que diagnosticar por qué (público, anuncios o aprendizaje)."],
  cpl: v => v === null ? ["gris","Sin leads todavía: no hay coste por lead."] : v <= 25 ? ["verde","Hasta 25 € por lead: objetivo del plan del 04/11 (hipótesis)."] : v <= 40 ? ["ambar","Entre 25 y 40 €: por encima del objetivo del plan, sin llegar a la alarma de 40 €."] : ["rojo","Más de 40 € por lead: alarma del plan del 04/11. Recuerda que mide volumen, no calidad."],
  leads: (v, gasto) => gasto === null ? null : (gasto >= 40 && (v||0) === 0) ? ["rojo","Más de 40 € gastados sin ningún lead. Regla: un anuncio así se pausa si quedan otros dos."] : null,
  cple: (v, nombre) => {
    if(v === null) return ["gris","Falta el dato de Odoo: cuántos leads son de empresa. Lo da Juancho."];

    return `<article class="vc ${on?"on":""}" data-id="${esc(c.id)}"><h3>${esc(c.nombre)}</h3><span class="pill ${col}">${esc(txt)}</span>
      <div class="dat"><span>Hoy: <b>${esc(eur(c.hoy.gasto))}</b> gastados</span><span><b>${esc(ent(c.hoy.leads))}</b> ${c.hoy.leads===1?"lead":"leads"}</span>
        ${c.presupuesto_total!==null?`<span>Presupuesto total: <b>${esc(eur0(c.presupuesto_total))}</b></span>`:""}${c.fin?`<span>Hasta el <b>${esc(new Date(new Date(c.fin).getTime()-6e4).toLocaleDateString("es-ES",{timeZone:"Europe/Madrid",day:"2-digit",month:"2-digit"}))}</b> incluido</span>`:""}</div>
      <div class="ctl">
        ${c.presupuesto_dia!==null?`<label class="ppto"><input type="number" inputmode="decimal" min="1" max="100" step="1" value="${esc(c.presupuesto_dia)}" aria-label="Presupuesto diario en euros de ${esc(c.nombre)}" data-ppto><span>€/día</span></label>
        <button class="btn sec" type="button" data-acc="presupuesto">Aceptar</button>`:""}
        <button class="btn ${conf?"confirmar":on?"parar":"activar"}" type="button" data-acc="conmutar">${conf?(on?"Pulsa otra vez para parar":"Pulsa otra vez para activar"):(on?"Parar":"Activar")}</button>
      </div>
      ${m?`<div class="msg ${m.ok?"bien":"err"}" role="status">${esc(m.t)}</div>`:""}
      ${c.horario?`<div class="hor">${esc(textoHorario(c.horario))}</div>`:""}
    </article>`;
  };
  const ult = (V.cambios || []).slice(0,5);
  cont.innerHTML = (visibles.length ? visibles.map(card).join("") : `<div class="tarjeta">No hay campañas recientes.</div>`)
    + (todas.length > visibles.length || verTodas ? `<button class="vermas" type="button" id="vivo-todas">${verTodas ? "Ver solo las recientes" : `Ver todas (${todas.length})`}</button>` : "")
    + (ult.length ? `<details class="leer" style="margin-top:6px"><summary>Últimos cambios</summary><ul class="cambios">${ult.map(x =>
        `<li>${fechaHora(x.cuando)} · ${esc(x.quien||"")} · ${esc(x.accion)} ${esc(x.campana||"")}${x.despues&&x.despues.euros?` → ${esc(eur0(x.despues.euros))}/día`:""}${x.resultado!=="ok"?` · ${esc(x.resultado)}`:""}</li>`).join("")}</ul></details>` : "");
  const bt = $("#vivo-todas"); if(bt) bt.onclick = () => { verTodas = !verTodas; pintarVivo(); };
  cont.querySelectorAll(".vc button[data-acc]").forEach(b => b.onclick = () => accionVivo(b));
  cont.querySelectorAll(".vc input[data-ppto]").forEach(i => i.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); accionVivo(i.closest(".vc").querySelector('[data-acc="presupuesto"]')); } });
}
async function llamar(metodo, cuerpo){
  const s = await HubSesion.sesion();
  if(!s) throw new Error("Inicia sesión de nuevo");
  const r = await fetch(API_CAMP, {method: metodo, cache: "no-store",
    headers: {Authorization: "Bearer " + s.access_token, apikey: ANON, "Content-Type": "application/json"},
    body: cuerpo ? JSON.stringify(cuerpo) : undefined});
  const j = await r.json().catch(() => ({}));
  if(j.falta_token){ faltaToken = true; throw new Error("falta token"); }
  if(!r.ok) throw new Error(j.error || ("error " + r.status));
  faltaToken = false;
  return j;
}
async function cargarVivo(){
  try{ V = await llamar("GET"); vivoErr = null; }
  catch(e){ vivoErr = String(e.message || e); }
  pintarVivo();
}
async function accionVivo(btn){
  const art = btn.closest(".vc"), id = art.dataset.id, c = V.campanas.find(x => x.id === id); if(!c) return;
  let cuerpo;
  if(btn.dataset.acc === "presupuesto"){
    const v = Number(String(art.querySelector("[data-ppto]").value).replace(",", "."));
    if(!(v >= 1 && v <= 100)){ mensajes[id] = {ok:false, t:"Pon un presupuesto entre 1 y 100 € al día."}; pintarVivo(); return; }
    if(v === c.presupuesto_dia){ mensajes[id] = {ok:true, t:"Ya está en ese presupuesto."}; pintarVivo(); return; }
    cuerpo = {accion: "presupuesto", id, euros: v};
  }else{
    // Doble pulsación: encender o parar gasta (o deja de gastar) dinero de verdad.
    if(!(pendiente[id] && pendiente[id].tipo === "conmutar")){
      pendiente[id] = {tipo: "conmutar"}; delete mensajes[id]; pintarVivo();
      setTimeout(() => { if(pendiente[id]){ delete pendiente[id]; pintarVivo(); } }, 6000);
      return;
    }
    delete pendiente[id];
    cuerpo = {accion: c.estado === "ACTIVE" ? "pausar" : "activar", id};
  }
  art.querySelectorAll("button,input").forEach(x => x.disabled = true);
  try{
    V = await llamar("POST", cuerpo);
    mensajes[id] = {ok:true, t: cuerpo.accion === "presupuesto" ? `Hecho: ${eur0(cuerpo.euros)} al día.` : cuerpo.accion === "activar" ? "Activada. Meta puede tardar unos minutos en empezar a enseñarla." : "Parada."};
  }catch(e){
    mensajes[id] = {ok:false, t: "No se ha podido: " + (e.message || e)};
  }
  pintarVivo();
  setTimeout(() => { delete mensajes[id]; pintarVivo(); }, 8000);
}
setInterval(() => { const a = document.activeElement; if(!document.hidden && V && !(a && a.matches && a.matches("[data-ppto]"))) cargarVivo(); }, 120000);

/* ---------------- Burbuja de ayuda (también en móvil: se abre al tocar) ---------------- */
const bur = $("#burbuja"); let abierta = null;
function cerrar(){ bur.hidden = true; if(abierta) abierta.setAttribute("aria-expanded","false"); abierta = null; }
function abrir(btn, titulo, texto, ej){
  if(abierta === btn){ cerrar(); return; }
  cerrar();
  bur.innerHTML = `<b>${esc(titulo)}</b>${esc(texto)}${ej?`<span class="ej">Ejemplo: ${esc(ej)}</span>`:""}`;
  bur.hidden = false; abierta = btn; btn.setAttribute("aria-expanded","true");
  const r = btn.getBoundingClientRect(), w = Math.min(300, innerWidth - 32);
  bur.style.maxWidth = w + "px";
  const left = Math.max(16, Math.min(r.left + scrollX - 20, scrollX + innerWidth - w - 16));
  bur.style.left = left + "px"; bur.style.top = (r.bottom + scrollY + 8) + "px";
}
document.addEventListener("click", ev => {
  const b = ev.target.closest(".q");
  if(b){ const g = G[b.dataset.g]; abrir(b, g.t, g.d, g.ej && g.ej()); return; }
  const s = ev.target.closest(".sem");
  if(s){ abrir(s, "Regla del semáforo", s.dataset.regla); return; }
  const t = ev.target.closest(".tab:not(.lp)");
  if(t){ cerrar(); pintarRes(t.dataset.p); return; }
  if(!ev.target.closest("#burbuja")) cerrar();
});
document.addEventListener("keydown", e => { if(e.key === "Escape") cerrar(); });
addEventListener("resize", cerrar);
$("#salir").onclick = () => HubSesion.salir();

/* ---------------- Carga ---------------- */
const banda = HubBanda.montar({limite: 26, quien: "La vigilancia diaria de Meta Ads"}), freno = {};
async function cargar(){
  if(!HubBanda.puedeConsultar(freno)) return;   // como mucho una consulta a Supabase cada 5 min
  try{
    const c = await HubSesion.exigir(); if(!c) return;
    const p = await HubSesion.leerPanel("publicidad");
    if(!p){
      banda.fallo(); $("#act").textContent = "Aún no hay datos.";
      $("#main").innerHTML = `<div class="vacio">Aún no hay datos. Si esperabas verlos, puede que tu cuenta no tenga acceso a este panel: solo lo ven las cuentas de administración.</div>`;
      return;
    }
    pintar(p);
  }catch(e){
    banda.fallo(); $("#act").textContent = "No se han podido cargar los datos.";
    $("#main").innerHTML = `<div class="vacio">No se han podido cargar los datos. Comprueba la conexión y vuelve a intentarlo.</div>`;
  }
}
cargar();
document.addEventListener("visibilitychange", () => { if(!document.hidden && D) cargar(); });
})();

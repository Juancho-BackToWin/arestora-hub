<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arestora Hub — Grupo Arestora</title>
<meta name="theme-color" content="#0B2A5B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arestora Hub">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/favicon.svg">
<style>
  :root{
    --tinta:#0B2A5B; --tinta-2:#12336B;
    --papel:#EEF2F8; --carta:#FFFFFF;
    --texto:#152238; --suave:#5B6B85; --borde:#DDE4EF;
    --radio:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--papel); color:var(--texto);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}

  /* ---------- cabecera ---------- */
  header.top{
    background:var(--tinta); color:#fff; padding:18px 20px 16px;
    position:sticky; top:0; z-index:30; box-shadow:0 2px 14px rgba(11,42,91,.18);
  }
  .top-row{display:flex;align-items:center;gap:12px;max-width:1180px;margin:0 auto}
  .marca{
    font-size:20px;font-weight:800;letter-spacing:.06em;
    background:#1B4FD8;padding:10px 18px;border-radius:12px;flex:1;
  }
  .actu{
    display:flex;align-items:center;gap:7px;flex:none;font-family:inherit;
    padding:9px 14px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;
    border:1px solid rgba(255,255,255,.28);background:transparent;color:rgba(255,255,255,.6);
    transition:.18s;
  }
  .actu:disabled{cursor:default}
  .actu .punto{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.45);flex:none}
  .actu[data-estado="al-dia"]{color:rgba(255,255,255,.55)}
  .actu[data-estado="al-dia"] .punto{background:#5FD08A}
  .actu[data-estado="actualizar"]{
    background:#fff;color:var(--tinta);border-color:#fff;
    animation:latido 1.8s ease-in-out infinite;
  }
  .actu[data-estado="actualizar"] .punto{background:#E0620D}
  .actu[data-estado="recargar"]{background:#fff;color:var(--tinta);border-color:#fff}
  .actu[data-estado="recargar"] .punto{background:#1B4FD8}
  .actu[data-estado="local"]{opacity:.5}
  .actu[data-estado="local"] .punto{background:rgba(255,255,255,.4)}
  @keyframes latido{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.5)}50%{box-shadow:0 0 0 7px rgba(255,255,255,0)}}
  @media(max-width:420px){.actu span:not(.punto){display:none}.actu{padding:9px 11px}}
  .avatar{
    width:44px;height:44px;border-radius:50%;background:#1B4FD8;
    display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;
  }
  .buscador{max-width:1180px;margin:14px auto 0;position:relative}
  .buscador input{
    width:100%;padding:12px 14px 12px 40px;border-radius:12px;border:0;
    font-size:15px;background:rgba(255,255,255,.14);color:#fff;outline:none;
  }
  .buscador input::placeholder{color:rgba(255,255,255,.6)}
  .buscador input:focus{background:rgba(255,255,255,.22);box-shadow:0 0 0 2px rgba(255,255,255,.35)}
  .lupa{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.65}
  .filtros{display:flex;gap:8px;flex-wrap:wrap;max-width:1180px;margin:12px auto 0}
  .chip{
    border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;
    padding:7px 14px;border-radius:999px;font-size:13px;cursor:pointer;
    font-family:inherit;transition:.15s;
  }
  .chip:hover{background:rgba(255,255,255,.12)}
  .chip[aria-pressed="true"]{background:#fff;color:var(--tinta);border-color:#fff;font-weight:700}

  .sello{
    max-width:1180px;margin:11px auto 0;font-size:11px;letter-spacing:.05em;
    color:rgba(255,255,255,.5);font-variant-numeric:tabular-nums;
  }

  /* ---------- resumen ---------- */
  .resumen{max-width:1180px;margin:18px auto 0;padding:0 20px;display:flex;gap:10px;flex-wrap:wrap}
  .kpi{
    background:var(--carta);border:1px solid var(--borde);border-radius:14px;
    padding:12px 16px;flex:1;min-width:calc(50% - 6px);
  }
  @media(min-width:700px){.kpi{min-width:120px}}
  .kpi b{display:block;font-size:26px;line-height:1.1;color:var(--tinta)}
  .kpi span{font-size:11.5px;color:var(--suave);text-transform:uppercase;letter-spacing:.06em}

  /* ---------- espacios ---------- */
  main{max-width:1180px;margin:0 auto;padding:0 0 40px}
  .espacio{margin-top:26px}
  .banda{
    color:#fff;padding:18px 20px;display:flex;align-items:center;gap:14px;
  }
  .banda img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:10px;padding:5px;flex:none}
  .banda h2{margin:0;font-size:21px;font-weight:800}
  .banda p{margin:3px 0 0;font-size:13.5px;opacity:.9;line-height:1.35}
  .rejilla{display:grid;gap:14px;padding:16px 20px;grid-template-columns:1fr}
  @media(min-width:640px){.rejilla{grid-template-columns:repeat(2,1fr)}}
  @media(min-width:1000px){.rejilla{grid-template-columns:repeat(3,1fr)}}

  /* ---------- tarjetas ---------- */
  .card{
    background:var(--carta);border:1px solid var(--borde);border-radius:var(--radio);
    padding:18px;display:flex;flex-direction:column;gap:12px;position:relative;
    border-left:5px solid var(--borde);transition:.18s;
  }
  .card.on{border-left-color:var(--c);box-shadow:0 3px 14px rgba(11,42,91,.07)}
  .card.on:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(11,42,91,.12)}
  .card.off{opacity:.72}
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .icono{
    width:64px;height:64px;border-radius:12px;display:grid;place-items:center;
    background:#F4F7FC;overflow:hidden;flex:none;font-size:30px;
  }
  .icono img{width:100%;height:100%;object-fit:contain;padding:6px}
  .pill{
    font-size:10.5px;font-weight:800;letter-spacing:.08em;padding:6px 12px;border-radius:999px;
    background:#EAEFF7;color:#5B6B85;white-space:nowrap;
  }
  .pill.activo{background:var(--c);color:#fff}
  .pill.en_proceso{background:color-mix(in srgb,var(--c) 16%,#fff);color:var(--c)}
  h3{margin:0;font-size:19px;font-weight:800;color:var(--c)}
  .card.off h3{color:#41527A}
  .desc{margin:0;font-size:14.5px;line-height:1.45;color:#3D4C68}
  .meta{font-size:12px;color:var(--suave)}
  .meta.acceso{font-size:11.5px;color:#7A8AA3;margin-top:-6px}
  .acciones{margin-top:auto;display:flex;flex-direction:column;gap:8px}
  .btn{
    display:block;text-align:center;padding:13px 16px;border-radius:12px;
    font-size:15px;font-weight:700;font-family:inherit;border:0;cursor:pointer;
  }
  .btn.primario{background:var(--c);color:#fff}
  .btn.primario:hover{filter:brightness(1.08)}
  .btn.mudo{background:#F1F4FA;color:#8494AE;cursor:default}
  .btn.sec{background:#fff;border:1px solid var(--borde);color:var(--suave);font-size:13px;padding:9px}
  .btn.sec:hover{border-color:var(--c);color:var(--c)}

  .vacio{padding:40px 20px;text-align:center;color:var(--suave)}

  /* ---------- pendientes ---------- */
  .pendientes{
    max-width:1180px;margin:28px auto 0;padding:18px 20px;background:#FFF8E8;
    border:1px solid #F0DFB0;border-radius:var(--radio);
  }
  .pendientes h4{margin:0 0 8px;font-size:14px;color:#8A6100;letter-spacing:.04em;text-transform:uppercase}
  .pendientes ul{margin:0;padding-left:18px;font-size:13.5px;color:#6B5210;line-height:1.6}

  footer{
    background:var(--tinta);color:#fff;padding:22px 20px;margin-top:34px;
    display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;
  }
  footer span{opacity:.75}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <div class="marca">ARESTORA HUB</div>
    <button id="btnAct" class="actu" data-estado="comprobando" disabled
            title="Comprobando si hay una versión más reciente">
      <span class="punto"></span><span id="actTxt">Comprobando</span>
    </button>
    <div class="avatar">JA</div>
  </div>
  <div class="buscador">
    <span class="lupa">&#128269;</span>
    <input id="q" type="search" placeholder="Buscar herramienta, sector o vertical..." autocomplete="off">
  </div>
  <div class="filtros" id="filtros"></div>
  <div class="sello" id="sello"></div>
</header>

<div class="resumen" id="resumen"></div>
<main id="main"></main>
<div id="pendientes"></div>

<footer>
  <span id="pie-izq"></span>
  <span id="pie-der"></span>
</footer>

const HUELLA = "d5f8dc812819";
const MODO = "sitio";   // "sitio" = publicado como web  |  "artefacto" = panel de Claude
let filtro = "todo", texto = "";

const ETQ = CAT.estados;

function contar(){
  const c = {activo:0,en_proceso:0,proximamente:0,total:0};
  CAT.espacios.forEach(e=>e.herramientas.forEach(h=>{c.total++; if(c[h.estado]!==undefined)c[h.estado]++;}));
  return c;
}

function pintarResumen(){
  const c = contar();
  document.getElementById('resumen').innerHTML = `
    <div class="kpi"><b>${c.total}</b><span>Herramientas</span></div>
    <div class="kpi"><b>${c.activo}</b><span>Activas</span></div>
    <div class="kpi"><b>${c.en_proceso}</b><span>En proceso</span></div>
    <div class="kpi"><b>${c.proximamente}</b><span>Próximas</span></div>`;
}

function pintarFiltros(){
  const opciones = [["todo","Todo"],["activo","Activo"],["en_proceso","En proceso"],["proximamente","Próximamente"]];
  document.getElementById('filtros').innerHTML = opciones.map(([k,v])=>
    `<button class="chip" data-f="${k}" aria-pressed="${filtro===k}">${v}</button>`).join('');
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filtro=b.dataset.f;pintarFiltros();pintar();});
}

function coincide(h, esp){
  if(filtro!=="todo" && h.estado!==filtro) return false;
  if(!texto) return true;
  const t = (h.nombre+" "+h.descripcion+" "+(h.sector||"")+" "+esp.nombre).toLowerCase();
  return t.includes(texto);
}

function tarjeta(h){
  // En el panel de Claude no hay servidor: solo funcionan los enlaces absolutos.
  const relativa = h.url && !/^https?:\/\//i.test(h.url);
  const activa = !!h.url && !(MODO === "artefacto" && relativa);
  const icono = h.logo_src
      ? `<div class="icono"><img src="${h.logo_src}" alt=""></div>`
      : `<div class="icono">${h.emoji||"🛡️"}</div>`;
  const boton = activa
      ? `<a class="btn primario" href="${h.url}" target="_blank" rel="noopener">Acceder al panel →</a>`
      : `<span class="btn mudo">${h.estado==="activo"?"Pendiente de enlazar":(h.estado==="en_proceso"?"En desarrollo":"En preparación")}</span>`;
  const carpeta = h.carpeta
      ? `<button class="btn sec" data-copy="${h.carpeta.replace(/\\/g,'&#92;')}">Copiar ruta de la carpeta</button>` : "";
  return `<article class="card ${activa?'on':'off'}" style="--c:${h.color||'#1B4FD8'}">
      <div class="card-top">${icono}<span class="pill ${h.estado}">${(ETQ[h.estado]||{}).etiqueta||h.estado}</span></div>
      <h3>${h.nombre}</h3>
      <p class="desc">${h.descripcion}</p>
      ${h.sector?`<div class="meta">${h.sector}</div>`:""}
      ${h.acceso&&h.acceso.length?`<div class="meta acceso">&#128274; Acceso: ${h.acceso.join(", ")}</div>`:""}
      <div class="acciones">${boton}${carpeta}</div>
    </article>`;
}

function pintar(){
  const html = CAT.espacios.map(esp=>{
    const hs = esp.herramientas.filter(h=>coincide(h,esp));
    if(!hs.length) return "";
    const logo = esp.logo_src?`<img src="${esp.logo_src}" alt="">`:"";
    return `<section class="espacio">
      <div class="banda" style="background:${esp.color}">
        ${logo}
        <div><h2>${esp.nombre}</h2><p>${esp.descripcion}</p></div>
      </div>
      <div class="rejilla">${hs.map(tarjeta).join('')}</div>
    </section>`;
  }).join('');
  document.getElementById('main').innerHTML = html ||
    `<div class="vacio">No hay herramientas que coincidan con la búsqueda.</div>`;
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{
    navigator.clipboard.writeText(b.dataset.copy);
    const o=b.textContent; b.textContent="Ruta copiada ✓"; setTimeout(()=>b.textContent=o,1600);
  });
}

function pintarPendientes(){
  const av=[];
  CAT.espacios.forEach(e=>e.herramientas.forEach(h=>{
    if(h.estado==="activo" && !h.url) av.push(`<b>${h.nombre}</b> está marcada como activa pero no tiene URL de acceso.`);
    if(!h.logo_src && !h.emoji) av.push(`<b>${h.nombre}</b> no tiene logotipo ni icono.`);
    if(h.notas && h.notas.startsWith("PENDIENTE")) av.push(`<b>${h.nombre}</b>: ${h.notas.replace("PENDIENTE: ","")}`);
  }));
  document.getElementById('pendientes').innerHTML = av.length
    ? `<div class="pendientes"><h4>Coherencia del catálogo — ${av.length} punto(s) a resolver</h4><ul>${[...new Set(av)].map(x=>`<li>${x}</li>`).join('')}</ul></div>`
    : "";
}

document.getElementById('q').oninput = e=>{texto=e.target.value.trim().toLowerCase();pintar();};
document.getElementById('sello').textContent =
  "v" + CAT.meta.version + " · catálogo " + CAT.meta.generado + " · " + HUELLA +
  " · " + CAT.espacios.reduce((n,e)=>n+e.herramientas.length,0) + " herramientas";
document.getElementById('pie-izq').textContent = "© " + new Date().getFullYear() + " " + CAT.meta.organizacion + " — Uso interno exclusivo";
document.getElementById('pie-der').textContent = "Arestora Hub v" + CAT.meta.version + " · catálogo " + CAT.meta.generado;

pintarResumen(); pintarFiltros(); pintar(); pintarPendientes();

/* ---------- botón Actualizar ----------
   Compara la huella incrustada en esta página con la del fichero version.json que
   está publicado junto a ella. Solo se activa si son distintas. Si la página se abre
   como fichero local (file://) no hay servidor al que preguntar y el botón se oculta. */
const btn = document.getElementById('btnAct'), txt = document.getElementById('actTxt');
function estado(e, t, titulo){ btn.dataset.estado = e; txt.textContent = t; btn.title = titulo;
  btn.disabled = (e !== 'actualizar'); }

async function comprobar(){
  if(MODO === 'artefacto'){
    estado('recargar','Recargar','Vuelve a cargar el Hub para traer la última versión publicada por Claude.');
    btn.disabled = false;
    return;
  }
  if(location.protocol === 'file:'){
    estado('local','Sin publicar','Estás viendo una copia local. El aviso de actualizaciones solo funciona en la versión publicada en internet.');
    return;
  }
  try{
    const r = await fetch('version.json?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw 0;
    const v = await r.json();
    if(v.huella && v.huella !== HUELLA){
      estado('actualizar','Actualizar','Hay una versión más reciente del Hub. Pulsa para cargarla.');
    }else{
      estado('al-dia','Al día','Estás viendo la última versión publicada.');
    }
  }catch(e){ estado('local','Sin conexión','No se ha podido comprobar si hay versiones nuevas.'); }
}

btn.onclick = async () => {
  txt.textContent = 'Cargando';
  btn.disabled = true;
  try{ const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); }catch(e){}
  try{ const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r => r.unregister())); }catch(e){}
  location.reload(true);
};

comprobar();
setInterval(comprobar, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if(!document.hidden) comprobar(); });

if('serviceWorker' in navigator && location.protocol !== 'file:' && MODO === 'sitio'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>

<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Innovation Lab OS</title>
<style>
:root{
  color-scheme:light;
  --paper:#f3f5f3;
  --sheet:#ffffff;
  --sheet-2:#eceff0;
  --rule:#d3d9d8;
  --rule-2:#bcc4c3;
  --ink:#12181a;
  --ink-2:#4d5658;
  --ink-3:#5f6a6c;
  --rule-ui:#8b9695;
  --good-ink:#0a6b22; --warning-ink:#8a5a00; --serious-ink:#a4441c; --critical-ink:#b3261e;
  --stamp:#1f4fa8;
  --stamp-soft:#e7eefa;
  --seal:#b3261e;
  --seal-soft:#fbeceb;
  --surface-1:#fcfcfb;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --paper:#101413;
  --sheet:#181d1d;
  --sheet-2:#1f2525;
  --rule:#2c3433;
  --rule-2:#3d4746;
  --ink:#e8edec;
  --ink-2:#a3adac;
  --ink-3:#939d9b;
  --rule-ui:#5c6867;
  --good-ink:#5fd07f; --warning-ink:#f0b429; --serious-ink:#f09a6d; --critical-ink:#f08a8a;
  --stamp:#6ea3ef;
  --stamp-soft:#1a2740;
  --seal:#e88079;
  --seal-soft:#2c1a18;
  --surface-1:#1a1a19;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:14.5px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--stamp);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- estructura ---------- */
#app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
aside{
  background:var(--sheet);border-right:1px solid var(--rule);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{padding:20px 18px 16px;border-bottom:1px solid var(--rule)}
.brand .k{
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-3);display:block;margin-bottom:5px
}
.brand .n{display:block;font-size:14px;font-weight:700;letter-spacing:-.1px;line-height:1.3}
.brand .o{display:block;font-size:11.5px;color:var(--ink-2);margin-top:3px}
nav.mods{padding:10px 8px;flex:1}
nav.mods button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;
  padding:8px 10px;border-radius:5px;cursor:pointer;color:var(--ink-2);font-size:13.5px;
}
nav.mods button:hover{background:var(--sheet-2);color:var(--ink)}
nav.mods button[aria-current="page"]{background:var(--stamp-soft);color:var(--stamp);font-weight:600}
nav.mods .code{
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;border:1px solid var(--rule-2);
  border-radius:3px;padding:1px 4px;color:var(--ink-3);min-width:26px;text-align:center;flex:none
}
nav.mods button[aria-current="page"] .code{border-color:currentColor;color:inherit}
nav.mods .sep{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);padding:14px 10px 5px
}
.side-foot{padding:12px;border-top:1px solid var(--rule);display:grid;gap:6px}
.side-foot .save{font-size:11px;color:var(--ink-3);font-family:var(--mono)}

main{min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--rule);
  background:var(--sheet);position:sticky;top:0;z-index:9;flex-wrap:wrap
}
.topbar h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.3px}
.topbar .sub{font-size:12px;color:var(--ink-2);margin:0}
.spacer{flex:1}
.content{padding:22px 24px 70px;max-width:1240px;width:100%}

/* ---------- controles ---------- */
.btn{
  background:var(--sheet);border:1px solid var(--rule-ui);border-radius:5px;padding:6px 12px;
  cursor:pointer;font-size:13px;color:var(--ink);white-space:nowrap;min-height:32px
}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--stamp);border-color:var(--stamp);color:#fff;font-weight:600}
html[data-theme="dark"] .btn.pri{color:#0d1522}
.btn.dgr{color:var(--seal);border-color:var(--seal)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dgr{color:var(--seal);border-color:var(--seal)}
.btn.sm{padding:5px 10px;font-size:12px;min-height:30px}
.field{display:grid;gap:4px;margin-bottom:13px}
.field label{font-size:11.5px;font-weight:650;color:var(--ink-2);letter-spacing:.02em}
.field .hint{font-size:11px;color:var(--ink-3);line-height:1.4}
input[type=text],input[type=date],input[type=number],select,textarea{
  background:var(--sheet);border:1px solid var(--rule-ui);border-radius:5px;padding:7px 9px;width:100%
}
textarea{min-height:76px;resize:vertical;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
@media(max-width:640px){.row2,.row3{grid-template-columns:1fr}}

/* ---------- tarjetas y listas ---------- */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:8px}
.sheet + .sheet{margin-top:14px}
.sheet-h{
  padding:13px 16px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px;flex-wrap:wrap
}
.sheet-h h2{font-size:13.5px;margin:0;font-weight:600}
.sheet-b{padding:16px}
.eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)
}
.rec{
  display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;
  padding:13px 16px;border-bottom:1px solid var(--rule);cursor:pointer
}
.rec:last-child{border-bottom:0}
.rec:hover{background:var(--sheet-2)}
.rec .id{
  font-family:var(--mono);font-size:11px;border:1px solid var(--rule-2);border-radius:4px;
  padding:2px 6px;color:var(--ink-2);white-space:nowrap
}
.rec .t{font-weight:600;font-size:14px;margin:0 0 2px;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rec .d{font-size:12.5px;color:var(--ink-2);margin:0;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rec .meta{font-size:11.5px;color:var(--ink-3);margin-top:5px;display:flex;gap:12px;flex-wrap:wrap}
.empty{padding:38px 16px;text-align:center;color:var(--ink-2)}
.empty p{margin:0 0 12px;font-size:13.5px}

/* etiquetas */
.chip{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:20px;
  border:1px solid var(--rule-2);color:var(--ink-2);background:var(--sheet);white-space:nowrap
}
.chip .dot{width:8px;height:8px;border-radius:50%;flex:none;background:currentColor}
.chip.st{font-weight:600}
.st-good{color:var(--good-ink);border-color:currentColor}
.st-warn{color:var(--warning-ink);border-color:currentColor}
.st-ser{color:var(--serious-ink);border-color:currentColor}
.st-crit{color:var(--critical-ink);border-color:currentColor}
.st-idle{color:var(--ink-3)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,12,12,.42);z-index:40;display:none}
.scrim.on{display:block}
.drawer{
  position:fixed;top:0;right:0;height:100%;width:min(660px,100%);background:var(--sheet);
  border-left:1px solid var(--rule);z-index:41;display:none;flex-direction:column
}
.drawer.on{display:flex}
.drawer-h{padding:15px 20px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px}
.drawer-h h3{margin:0;font-size:14.5px;font-weight:680}
.drawer-b{padding:20px;overflow-y:auto;flex:1}
.drawer-f{padding:13px 20px;border-top:1px solid var(--rule);display:flex;gap:9px;justify-content:flex-end}

/* ---------- panel de indicadores ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:900px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:14px 16px}
.tile .v{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.tile .k{font-size:11.5px;color:var(--ink-2);margin-top:3px}
.tile .s{font-size:11px;color:var(--ink-3);margin-top:5px}

.viz-root{--surface-1:var(--sheet)}
.barrow{display:grid;grid-template-columns:minmax(140px,26ch) 1fr 62px;gap:12px;align-items:center;margin-bottom:9px}
.barrow .lb{font-size:12.5px;color:var(--ink-2);overflow-wrap:anywhere}
.barrow .vl{font-family:var(--mono);font-size:12px;color:var(--ink-2);text-align:right}
.track{display:block;height:12px;background:var(--sheet-2);border-radius:6px;overflow:hidden}
.fill{display:block;height:100%;min-width:3px;border-radius:0 4px 4px 0;background:var(--s1)}
.stackbar{display:flex;height:26px;border-radius:6px;overflow:hidden;background:var(--sheet-2);gap:2px}
.stackbar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:11px}
.legend i{display:inline-flex;align-items:center;gap:6px;font-style:normal;font-size:12px;color:var(--ink-2)}
.legend b{width:10px;height:10px;border-radius:3px;display:block}

table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th{
  text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule-2);color:var(--ink-2);
  font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:650;font-family:var(--mono)
}
table.data td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top;color:var(--ink-2)}
table.data td strong{color:var(--ink)}
table.data tr:last-child td{border-bottom:0}
.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

.note{border-left:3px solid var(--stamp);background:var(--sheet-2);padding:11px 14px;border-radius:0 6px 6px 0;font-size:13px;color:var(--ink-2);margin:12px 0}
.note.seal{border-left-color:var(--seal)}
.note strong{color:var(--ink)}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:9px 16px;border-radius:6px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s
}
.toast.on{opacity:1}
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters input[type=text]{width:220px}
.filters select{width:auto;min-width:130px;max-width:230px}
.crit-row{display:grid;grid-template-columns:1fr 92px 120px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}
.crit-row:last-child{border-bottom:0}
@media(max-width:640px){
  .rec{grid-template-columns:auto 1fr;row-gap:8px}
  .rec > div:last-child{grid-column:1 / -1;flex-direction:row!important;align-items:center!important;flex-wrap:wrap;gap:6px}
  .rec .chip{white-space:normal;max-width:100%}
  .crit-row{grid-template-columns:1fr;gap:8px}
}
@media(max-width:900px){
  #app{grid-template-columns:1fr}
  .topbar{position:static}
  nav.mods button{min-height:44px}
  aside{position:static;height:auto;flex-direction:column}
  nav.mods{display:flex;flex-wrap:wrap;gap:4px}
  nav.mods button{width:auto}
  nav.mods .sep{display:none}
  .barrow{grid-template-columns:1fr;gap:4px}
  .barrow .vl{text-align:left}
}
@media print{
  aside,.topbar,#viewActions,.filters{display:none!important}
  #app{grid-template-columns:1fr}
  .content{max-width:none;padding:0}
  .sheet{break-inside:avoid;border-color:#999}
}
.skip{position:absolute;left:-9999px;top:0;background:var(--stamp);color:#fff;padding:9px 14px;border-radius:0 0 6px 0;z-index:99}
.skip:focus{left:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
fieldset.grp{border:1px solid var(--rule);border-radius:7px;padding:14px 15px 4px;margin:0 0 16px}
fieldset.grp legend{font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--ink-2);padding:0 6px}
.danger-zone{border-color:var(--seal)}
.pctlbl{font-size:11.5px;color:var(--ink-2);font-family:var(--mono);margin-top:4px}
.flowline{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.flowline .step{
  flex:1 1 120px;background:var(--sheet-2);border:1px solid var(--rule);border-radius:8px;
  padding:13px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:auto
}
.flowline .step:hover{border-color:var(--stamp)}
.flowline .step .n{font-family:var(--mono);font-size:23px;font-weight:600;line-height:1.1;color:var(--ink)}
.flowline .step .l{font-size:11.5px;color:var(--ink-2)}
.flowline .arrow{display:flex;align-items:center;color:var(--ink-3);font-size:15px;flex:none}
@media(max-width:640px){.flowline .arrow{display:none}.flowline .step{flex:1 1 44%}}
</style>
</head>
<body>
<a class="skip" href="#view">Ir al contenido</a>
<div id="app">
  <aside>
    <div class="brand">
      <span class="k">Innovation Lab OS</span>
      <span class="n" id="orgName">Arestora Innovation Lab</span>
      <span class="o" id="orgSub">Departamento de I+D+i</span>
    </div>
    <nav class="mods" id="nav" aria-label="Módulos"></nav>
    <div class="side-foot">
      <button class="btn sm" id="btnTheme">Cambiar a modo oscuro</button>
      <span class="save" id="saveState">—</span>
    </div>
  </aside>
  <main>
    <div class="topbar">
      <div>
        <h1 id="viewTitle">Panel</h1>
        <p class="sub" id="viewSub"></p>
      </div>
      <div class="spacer"></div>
      <div id="viewActions" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    </div>
    <div class="content" id="view" tabindex="-1"></div>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
  <div class="drawer-h">
    <h3 id="drawerTitle">Ficha</h3>
    <div class="spacer" style="flex:1"></div>
    <button class="btn sm" id="drawerClose">Cerrar</button>
  </div>
  <div class="drawer-b" id="drawerBody"></div>
  <div class="drawer-f" id="drawerFoot"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ============================================================
   INNOVATION LAB OS — esquema
   Motor dirigido por metadatos: los módulos declaran sus campos
   y de ahí salen lista, ficha, formulario, filtros y exportación.
   Añadir una línea, una convocatoria o un tipo de proyecto no
   requiere tocar código.
   ============================================================ */

const ROLES = ['admin','gestor','cliente','rb','cbp','candidato','empresa'];

/* Estado del Hub derivado del estado de desarrollo: una sola fuente, dos vocabularios. */
const ESTADO_HUB = {
  'En producción':'activo','En desarrollo':'en_proceso','En rediseño':'en_proceso',
  'En diseño':'proximamente','Idea':'idea','Retirada':''
};

const SERIES = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];

const TRL = [
  [1,'Principios básicos observados'],[2,'Concepto tecnológico formulado'],
  [3,'Prueba de concepto experimental'],[4,'Validación en laboratorio'],
  [5,'Validación en entorno relevante'],[6,'Demostración en entorno relevante'],
  [7,'Demostración en entorno real'],[8,'Sistema completo y cualificado'],
  [9,'Sistema probado en entorno real']
];

const ODS = ['1 Fin de la pobreza','2 Hambre cero','3 Salud y bienestar','4 Educación de calidad',
'5 Igualdad de género','6 Agua limpia','7 Energía asequible','8 Trabajo decente y crecimiento',
'9 Industria, innovación e infraestructura','10 Reducción de desigualdades','11 Ciudades sostenibles',
'12 Producción y consumo responsables','13 Acción por el clima','14 Vida submarina','15 Vida de ecosistemas',
'16 Paz y justicia','17 Alianzas'];

/* --- tipos de campo admitidos: text, textarea, select, multiselect, date, number, ref, refs, chips --- */

const MODULES = [
  {
    id:'panel', code:'KP', name:'Panel', kind:'custom', group:'Dirección'
  },
  {
    id:'lineas', code:'LI', name:'Líneas', group:'Dirección',
    singular:'línea', article:'la', prefix:'L',
    titleField:'nombre', descField:'objetivo',
    fields:[
      {k:'codigo',l:'Código',t:'text',req:true,hint:'Identificador corto y estable. Ej.: L-IV'},
      {k:'nombre',l:'Denominación',t:'text',req:true},
      {k:'ambito',l:'Ámbito',t:'select',o:['Investigación aplicada','Desarrollo tecnológico','Innovación organizativa','Innovación de producto o servicio','Innovación social','Mixta']},
      {k:'estado',l:'Estado',t:'select',o:['Tractora','Captura activa','Exploratoria','En pausa','Cerrada'],st:{'Tractora':'good','Captura activa':'warn','Exploratoria':'idle','En pausa':'ser','Cerrada':'idle'}},
      {k:'objetivo',l:'Objetivo',t:'textarea'},
      {k:'preguntas',l:'Preguntas de investigación',t:'textarea',hint:'Una por línea.'},
      {k:'activos',l:'Activos que la alimentan',t:'textarea'},
      {k:'responsable',l:'Referente',t:'text'},
      {k:'notas',l:'Notas',t:'textarea'}
    ]
  },
  {
    id:'proyectos', code:'CA', name:'Cartera', group:'Innovación',
    singular:'proyecto', article:'el', prefix:'P',
    titleField:'titulo', descField:'resumen',
    fields:[
      {k:'codigo',l:'Código de expediente',t:'text',req:true,hint:'Ej.: AIL-02'},
      {k:'titulo',l:'Título',t:'text',req:true},
      {k:'lineaId',l:'Línea',t:'ref',ref:'lineas'},
      {k:'tipo',l:'Naturaleza',t:'select',o:['Investigación aplicada','Desarrollo experimental','Innovación en proceso','Innovación organizativa','Innovación de producto o servicio','Metodológico','Infraestructura de datos']},
      {k:'estado',l:'Estado',t:'select',o:['Idea','Definición','En ejecución','En validación','Cerrado','Descartado'],st:{'En ejecución':'good','En validación':'warn','Definición':'idle','Idea':'idle','Cerrado':'idle','Descartado':'crit'}},
      {k:'prioridad',l:'Prioridad',t:'select',o:['Crítica','Alta','Media','Baja'],st:{'Crítica':'crit','Alta':'ser','Media':'warn','Baja':'idle'}},
      {k:'resumen',l:'Resumen',t:'textarea',hint:'Qué se hace y para qué, en cinco líneas.'},
      {k:'problema',l:'Problema y situación de partida',t:'textarea',hint:'Cuantificado siempre que sea posible: horas, coste, porcentajes, volúmenes. Sin cifras de partida no hay forma de saber después si mejoró.'},
      {k:'hipotesis',l:'Hipótesis',t:'textarea',hint:'Formulada de modo que pueda resultar falsa.'},
      {k:'incertidumbre',l:'Incertidumbre técnica o científica',t:'textarea',hint:'Qué no sabemos resolver de antemano. Si ya sabemos hacerlo, es implantación, no investigación.'},
      {k:'objetivos',l:'Objetivos',t:'textarea',hint:'Uno por línea, medibles.'},
      {k:'actividades',l:'Actividades y método',t:'textarea'},
      {k:'entregables',l:'Entregables',t:'textarea',hint:'Uno por línea.'},
      {k:'trlIni',l:'TRL de partida',t:'select',o:TRL.map(x=>String(x[0]))},
      {k:'trlAct',l:'TRL actual',t:'select',o:TRL.map(x=>String(x[0]))},
      {k:'trlObj',l:'TRL objetivo',t:'select',o:TRL.map(x=>String(x[0]))},
      {k:'inicio',l:'Inicio',t:'date'},
      {k:'fin',l:'Fin previsto',t:'date'},
      {k:'responsable',l:'Responsable',t:'text'},
      {k:'equipo',l:'Equipo y dedicaciones',t:'textarea',hint:'Persona, perfil y porcentaje o horas.'},
      {k:'horas',l:'Horas imputadas',t:'number'},
      {k:'presupuesto',l:'Presupuesto (€)',t:'number'},

  servicios:{nuevo:'Nuevo servicio',vacio:'Todavía no hay servicios analizados.',cta:'Analizar el primer servicio'},
  pilotos:{nuevo:'Nuevo piloto',vacio:'Todavía no hay pilotos registrados.',cta:'Registrar el primer piloto'},
  evidencias:{nuevo:'Nueva evidencia',vacio:'El repositorio de evidencias está vacío.',cta:'Registrar la primera evidencia'},
  propiedad:{nuevo:'Nuevo activo',vacio:'Todavía no hay activos inventariados.',cta:'Inventariar el primer activo'},
  ecosistema:{nuevo:'Nueva entidad',vacio:'Todavía no hay entidades en el ecosistema.',cta:'Registrar la primera entidad'},
  convocatorias:{nuevo:'Nueva convocatoria',vacio:'No hay convocatorias en el radar.',cta:'Añadir la primera convocatoria'},
  actas:{nuevo:'Nueva acta',vacio:'Todavía no hay actas registradas.',cta:'Registrar la primera acta'},
  apps:{nuevo:'Nueva app',vacio:'Todavía no hay apps registradas.',cta:'Registrar la primera app'},
  preguntas:{nuevo:'Nueva pregunta',vacio:'El banco de preguntas está vacío.',cta:'Anotar la primera pregunta'},
  hallazgos:{nuevo:'Nuevo hallazgo',vacio:'Todavía no hay hallazgos registrados.',cta:'Registrar el primer hallazgo'},
  mejoras:{nuevo:'Nueva mejora',vacio:'Todavía no hay mejoras registradas.',cta:'Registrar la primera mejora'},
  canonico:{nuevo:'Nueva entidad',vacio:'El diccionario de datos está vacío.',cta:'Definir la primera entidad'}
};
MODULES.forEach(m=>{if(NAMING[m.id])Object.assign(m,NAMING[m.id])});

/* --- etiquetas cortas para los desplegables de filtro --- */
const FL={conexion:'estado de conexión',disponibilidad:'disponibilidad del dato',confianza:'solidez',aiact:'clasificación de IA',baseJuridica:'base jurídica',captura:'estado de captura',verificable:'verificabilidad',
  sensibilidad:'sensibilidad',instrumento:'instrumento',etica:'dictamen ético',diseno:'diseño'};
MODULES.filter(m=>m.fields).forEach(m=>m.fields.forEach(f=>{if(FL[f.k])f.fl=FL[f.k]}));

/* --- agrupación del formulario de proyecto --- */
const MOD_GROUPS={
  proyectos:[
    ['Identificación',['codigo','titulo','lineaId','tipo','estado','prioridad','resumen']],
    ['Planteamiento científico',['problema','hipotesis','incertidumbre','objetivos']],
    ['Plan de trabajo',['actividades','entregables','kpis']],
    ['Madurez y calendario',['trlIni','trlAct','trlObj','inicio','fin']],
    ['Recursos y alianzas',['responsable','equipo','horas','presupuesto','financiacion','socios']],
    ['Resultados',['ods','resultados','notas']]
  ]
};

/* --- orden del ciclo: fuentes → investigación → innovación → respaldo --- */
const ORDEN=['panel','lineas','apps','servicios','canonico','preguntas','pilotos','hallazgos',
             'mejoras','proyectos','propiedad','evidencias','ecosistema','convocatorias','actas','ajustes'];
MODULES.sort((a,b)=>ORDEN.indexOf(a.id)-ORDEN.indexOf(b.id));

const MOD = Object.fromEntries(MODULES.map(m=>[m.id,m]));
const COLLECTIONS = MODULES.filter(m=>m.fields).map(m=>m.id);
</script>
<script>
/* ============================ estado y persistencia ============================ */
const KEY='arestora-lab-os-v1';
let DB=null, VIEW='panel', EDIT=null, FILTER={}, memoryOnly=false;

function blankDB(){
  const d={meta:{org:'Arestora Innovation Lab',sub:'Departamento de I+D+i',created:today(),saved:null,seq:{}}};
  COLLECTIONS.forEach(c=>d[c]=[]);
  return d;
}
function today(){return new Date().toISOString().slice(0,10)}
function uid(){return 'r'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){DB=migrate(JSON.parse(raw));return}
  }catch(e){memoryOnly=true}
  DB=seedDB();
  save();
}
function migrate(d){
  const base=blankDB();
  COLLECTIONS.forEach(c=>{
    d[c]=Array.isArray(d[c])?d[c].filter(r=>r&&typeof r==='object'&&!Array.isArray(r)):[];
    d[c].forEach(r=>{if(!r.id)r.id=uid()});
  });
  (d.convocatorias||[]).forEach(c=>{
    c.criterios=Array.isArray(c.criterios)?c.criterios.filter(x=>x&&typeof x==='object'):[];
  });
  d.meta=Object.assign(base.meta,(d.meta&&typeof d.meta==='object')?d.meta:{});
  return d;
}
function save(){
  DB.meta.saved=new Date().toISOString();
  try{
    localStorage.setItem(KEY,JSON.stringify(DB));
    memoryOnly=false;
  }catch(e){memoryOnly=true}
  paintSaveState();
}
function paintSaveState(){
  const el=document.getElementById('saveState');
  if(memoryOnly){
    el.textContent='Sin guardado local — exporta antes de cerrar';
    el.style.color='var(--seal)';
    return;
  }
  const t=DB.meta.saved?new Date(DB.meta.saved):null;
  el.textContent=t?('Guardado '+t.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})):'—';
  el.style.color='';
}

/* ============================ utilidades ============================ */
const $=s=>document.querySelector(s);
const norm=s=>String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2200)}
function fmtDate(d){
  if(d==null||d==='')return '—';
  d=String(d);
  if(/^\d{4}-\d{2}-\d{2}$/.test(d)){const p=d.split('-');return `${p[2]}/${p[1]}/${p[0]}`}
  return d;
}
function fd(d){return esc(fmtDate(d))}
function num(n){return (n==null||n==='')?null:Number(n)}
function fmtNum(n){return (n==null||n==='' ||isNaN(n))?'—':Number(n).toLocaleString('es-ES')}
function rec(col,id){return (DB[col]||[]).find(r=>r.id===id)||null}
function recTitle(col,id){const m=MOD[col],r=rec(col,id);return r?(r[m.titleField]||r.codigo||'—'):'—'}
function lineColor(lineaId){
  const i=DB.lineas.findIndex(l=>l.id===lineaId);
  return i<0?'var(--ink-3)':`var(${SERIES[i%SERIES.length]})`;
}
function nextCode(mid){
  const m=MOD[mid],rows=DB[mid]||[];
  let pre=m.prefix;
  for(let i=rows.length-1;i>=0;i--){
    const c=String(rows[i].codigo||'');
    const mm=c.match(/^(.*?)[-_ ]?(\d+)$/);
    if(mm&&mm[1]){pre=mm[1].replace(/[-_ ]$/,'');break}
  }
  const used=new Set(rows.map(r=>String(r.codigo||'')));
  let n=rows.length+1,code;
  do{code=`${pre}-${String(n).padStart(2,'0')}`;n++}while(used.has(code)&&n<999);
  return code;
}
function statusClass(m,f,v){
  const def=m.fields.find(x=>x.k===f);
  if(!def||!def.st)return 'st-idle';
  return 'st-'+({good:'good',warn:'warn',ser:'ser',crit:'crit',idle:'idle'}[def.st[v]]||'idle');
}

/* ============================ navegación ============================ */
function buildNav(){
  const nav=$('#nav');let html='',g=null;
  MODULES.forEach(m=>{
    if(m.group!==g){g=m.group;html+=`<div class="sep">${esc(g)}</div>`}
    const cur=(VIEW===m.id)||(String(VIEW).startsWith('call:')&&m.id==='convocatorias');
    html+=`<button data-m="${m.id}" ${cur?'aria-current="page"':''}>
      <span class="code">${esc(m.code)}</span><span>${esc(m.name)}</span></button>`;
  });
  nav.innerHTML=html;
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.m));
}
function go(id){VIEW=id;FILTER={};buildNav();render();window.scrollTo({top:0})}
function wireRows(sel,fn){
  document.querySelectorAll(sel).forEach(el=>{
    el.onclick=()=>fn(el);
    el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn(el)}};
  });
}

/* ============================ render principal ============================ */
function render(){
  if(String(VIEW).startsWith('call:')){return renderCall(VIEW.slice(5))}
  const m=MOD[VIEW];
  $('#viewTitle').textContent=m.name;
  $('#viewSub').textContent=m.intro||'';
  $('#viewActions').innerHTML='';
  if(m.id==='panel')return renderPanel();
  if(m.id==='ajustes')return renderAjustes();
  if(m.kind==='calls')return renderCalls();
  renderList(m);
}

function actionBtn(label,fn,cls){
  const b=document.createElement('button');b.className='btn '+(cls||'');b.textContent=label;b.onclick=fn;
  $('#viewActions').appendChild(b);return b;
}

/* ---------- lista genérica ---------- */
function renderList(m){
  actionBtn('Descargar CSV',()=>exportCSV(m.id));
  if(m.id==='apps'){
    actionBtn('Cargar catálogo del Hub',()=>pegarCatalogo());
    actionBtn('Exportar catálogo del Hub',()=>exportHub());
    actionBtn('Pegar ficha de alta',()=>pegarFicha());
  }
  actionBtn(m.nuevo||'Nueva ficha',()=>openForm(m.id,null),'pri');
  const rows=applyFilter(m,DB[m.id]);
  let h='';
  h+=filterBar(m);
  h+='<div class="sheet"><div class="sheet-h"><span class="eyebrow">'+esc(m.code)+'</span><h2>'+esc(m.name)+'</h2>'
    +'<span class="chip">'+rows.length+' de '+DB[m.id].length+' registros</span>'
    +(m.id==='apps'&&DB.meta.hubLeido?'<span class="chip st st-good">Sincronizado con el Hub</span>':'')
    +'</div>';
  if(!DB[m.id].length){
    h+=`<div class="empty"><p>${esc(m.vacio||'Todavía no hay registros.')}</p>
      <button class="btn pri" onclick="openForm('${m.id}',null)">${esc(m.cta||'Crear el primero')}</button></div>`;
  }else if(!rows.length){
    h+='<div class="empty"><p>Ningún registro coincide con el filtro.</p><button class="btn" onclick="clearFilter()">Quitar filtros</button></div>';
  }else{
    rows.forEach(r=>{h+=recRow(m,r)});
  }
  h+='</div>';
  $('#view').innerHTML=h;
  wireRows('[data-open]',el=>openDetail(m.id,el.dataset.open));
  wireFilterBar(m);
}

function recRow(m,r){
  const badges=[];
  if(r.lineaId)badges.push(`<span class="chip"><span class="dot" style="color:${lineColor(r.lineaId)}"></span>${esc(recTitle('lineas',r.lineaId))}</span>`);
  m.fields.filter(f=>f.st&&r[f.k]).slice(0,2).forEach(f=>{
    badges.push(`<span class="chip st ${statusClass(m,f.k,r[f.k])}">${esc(r[f.k])}</span>`);
  });
  const meta=[];
  if(r.trlAct)meta.push('TRL '+esc(r.trlAct));
  if(r.fecha)meta.push(fd(r.fecha));
  if(r.responsable)meta.push(esc(r.responsable));
  if(r.organismo)meta.push(esc(r.organismo));
  return `<div class="rec" data-open="${r.id}" tabindex="0" role="button" aria-label="Abrir ficha ${esc(r.codigo||'')} ${esc(r[m.titleField]||'')}">
    <span class="id">${esc(r.codigo||'—')}</span>
    <div><p class="t">${esc(r[m.titleField]||'Sin título')}</p>
      <p class="d">${esc(r[m.descField]||'')}</p>
      ${meta.length?`<div class="meta">${meta.map(x=>`<span>${x}</span>`).join('')}</div>`:''}</div>
    <div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end">${badges.join('')}</div>
  </div>`;
}

/* ---------- filtros ---------- */
function filterBar(m){
  const sel=m.fields.filter(f=>f.t==='select'&&f.st).slice(0,2);
  let h='<div class="filters"><input type="text" id="fq" placeholder="Buscar" value="'+esc(FILTER.q||'')+'" aria-label="Buscar">';
  if(DB.lineas.length&&m.fields.some(f=>f.k==='lineaId')){
    h+='<select id="fl" aria-label="Línea"><option value="">Todas las líneas</option>'+
      DB.lineas.map(l=>`<option value="${l.id}" ${FILTER.lineaId===l.id?'selected':''}>${esc(l.nombre)}</option>`).join('')+'</select>';
  }
  sel.forEach(f=>{
    h+=`<select data-fk="${f.k}" aria-label="${esc(f.l)}"><option value="">Cualquier ${esc(f.fl||f.l.toLowerCase())}</option>`+
      f.o.map(o=>`<option ${FILTER[f.k]===o?'selected':''}>${esc(o)}</option>`).join('')+'</select>';
  });
  h+='<button class="btn sm" onclick="clearFilter()">Limpiar</button></div>';
  return h;
}
function wireFilterBar(m){
  const q=$('#fq');if(q)q.oninput=()=>{FILTER.q=q.value;softRefresh(m)};
  const fl=$('#fl');if(fl)fl.onchange=()=>{FILTER.lineaId=fl.value;renderList(m)};
  document.querySelectorAll('[data-fk]').forEach(s=>s.onchange=()=>{FILTER[s.dataset.fk]=s.value;renderList(m)});
}
function softRefresh(m){
  const pos=$('#fq').selectionStart;renderList(m);
  const q=$('#fq');if(q){q.focus();q.setSelectionRange(pos,pos)}
}
function clearFilter(){FILTER={};render()}
function applyFilter(m,rows){
  let out=rows.slice();
  if(FILTER.q){
    const q=norm(FILTER.q);
    const keys=m.fields.map(f=>f.k);
    out=out.filter(r=>keys.some(k=>typeof r[k]==='string'&&norm(r[k]).includes(q)));
  }
  if(FILTER.lineaId)out=out.filter(r=>r.lineaId===FILTER.lineaId);
  m.fields.filter(f=>f.t==='select').forEach(f=>{if(FILTER[f.k])out=out.filter(r=>r[f.k]===FILTER[f.k])});
  return out;
}

/* ============================ drawer: ficha y formulario ============================ */
let LASTFOCUS=null;
function openDrawer(title){
  LASTFOCUS=document.activeElement;
  $('#drawerTitle').textContent=title;
  $('#drawer').classList.add('on');$('#scrim').classList.add('on');
  document.getElementById('app').inert=true;
}
function closeDrawer(force){
  if(EDIT&&!force&&formTouched()){
    if(!confirm('Hay cambios sin guardar en esta ficha. ¿Descartarlos?'))return;
  }
  $('#drawer').classList.remove('on');$('#scrim').classList.remove('on');
  document.getElementById('app').inert=false;
  EDIT=null;FORM0=null;
  if(LASTFOCUS&&document.contains(LASTFOCUS))LASTFOCUS.focus();
}
let FORM0=null;
function formSnapshot(){
  const f=$('#frm');if(!f)return null;
  return Array.from(f.elements).map(el=>el.multiple?Array.from(el.selectedOptions).map(o=>o.value).join(','):el.value).join('\u0001');
}
function formTouched(){return FORM0!==null&&formSnapshot()!==FORM0}
$('#drawerClose').onclick=()=>closeDrawer();
$('#scrim').onclick=()=>closeDrawer();
document.addEventListener('keydown',e=>{
  const open=$('#drawer').classList.contains('on');
  if(!open)return;
  if(e.key==='Escape'){e.preventDefault();closeDrawer();return}
  if(e.key==='Tab'){
    const f=$('#drawer').querySelectorAll('button,input,select,textarea,[href],[tabindex]:not([tabindex="-1"])');
    if(!f.length)return;
    const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  }
});

function openDetail(mid,id){
  const m=MOD[mid],r=rec(mid,id);if(!r)return;
  openDrawer(r.codigo+' · '+(r[m.titleField]||''));
  let h='';
  m.fields.forEach(f=>{
    const v=r[f.k];
    if(v===undefined||v===null||v===''||(Array.isArray(v)&&!v.length))return;
    let disp;
    if(f.t==='ref')disp=esc(recTitle(f.ref,v));
    else if(f.t==='refs'||f.t==='multiselect')disp=(Array.isArray(v)?v:[v]).map(x=>`<span class="chip">${esc(f.t==='refs'?recTitle(f.ref,x):x)}</span>`).join(' ');
    else if(f.t==='date')disp=fd(v);
    else if(f.t==='number')disp='<span style="font-family:var(--mono)">'+fmtNum(v)+'</span>';
    else if(f.st)disp=`<span class="chip st ${statusClass(m,f.k,v)}">${esc(v)}</span>`;
    else disp=nl(v);
    h+=`<div style="margin-bottom:15px"><div style="font-size:11.5px;font-weight:650;color:var(--ink-2);margin-bottom:3px">${esc(f.l)}</div><div>${disp}</div></div>`;
  });
  const links=linkedRecords(mid,id);
  if(links)h+=links;
  h+=`<div class="eyebrow" style="margin-top:20px">Registro</div>
      <div style="font-size:12px;color:var(--ink-3);font-family:var(--mono)">alta ${fd(r._c)} · última modificación ${fd(r._m)}</div>`;
  $('#drawerBody').innerHTML=h;
  $('#drawerFoot').innerHTML='';
  const del=document.createElement('button');del.className='btn dgr';del.textContent='Eliminar';
  del.onclick=()=>{if(confirm('Se elimina este registro y no se puede deshacer. ¿Continuar?')){DB[mid]=DB[mid].filter(x=>x.id!==id);save();cloudDelete(mid,id);closeDrawer(true);render();toast('Registro eliminado')}};
  const ed=document.createElement('button');ed.className='btn pri';ed.textContent='Editar';ed.onclick=()=>openForm(mid,id);
  if(mid==='proyectos'){
    const ex=document.createElement('button');ex.className='btn';ex.textContent='Descargar ficha (MD)';
    ex.onclick=()=>exportProject(id);
    $('#drawerFoot').append(del,ex,ed);
  }else{
    $('#drawerFoot').append(del,ed);
  }
}

function linkedRecords(mid,id){
  const map={proyectos:[['evidencias','proyectoId','Evidencias'],['pilotos','proyectoId','Pilotos'],['propiedad','proyectoId','Activos protegidos'],['convocatorias','proyectoId','Convocatorias']],
             lineas:[['proyectos','lineaId','Proyectos'],['servicios','lineaId','Servicios'],['evidencias','lineaId','Evidencias']]};
  const defs=map[mid];if(!defs)return '';
  let h='';
  defs.forEach(([col,fk,label])=>{
    const rows=DB[col].filter(r=>r[fk]===id);
    if(!rows.length)return;
    h+=`<div class="eyebrow" style="margin-top:18px;margin-bottom:5px">${esc(label)} (${rows.length})</div>`;
    h+=rows.map(r=>`<div style="padding:7px 0;border-bottom:1px solid var(--rule);font-size:13px">
      <span style="font-family:var(--mono);font-size:11px;color:var(--ink-3)">${esc(r.codigo)}</span>
      &nbsp;${esc(r[MOD[col].titleField]||'')}</div>`).join('');
  });
  return h;
}

function openForm(mid,id){
  const m=MOD[mid];
  const r=id?Object.assign({},rec(mid,id)):{codigo:nextCode(mid)};
  EDIT={mid,id};
  openDrawer(id?('Editar '+r.codigo):('Nuev'+(m.article==='la'?'a':'o')+' '+m.singular));
  const groups=MOD_GROUPS[mid];
  let h='<form id="frm" autocomplete="off"><p style="font-size:12px;color:var(--ink-2);margin:0 0 14px">Los campos marcados con <abbr title="obligatorio">*</abbr> son obligatorios. El resto se puede completar más adelante.</p>';
  if(groups){
    const seen=new Set();
    groups.forEach(([legend,keys])=>{
      h+=`<fieldset class="grp"><legend>${esc(legend)}</legend>`;
      keys.forEach(k=>{const f=m.fields.find(x=>x.k===k);if(f){seen.add(k);h+=formField(f,r)}});
      h+='</fieldset>';
    });
    const restantes=m.fields.filter(f=>!seen.has(f.k));
    if(restantes.length){h+='<fieldset class="grp"><legend>Otros datos</legend>'+restantes.map(f=>formField(f,r)).join('')+'</fieldset>'}
  }else{
    m.fields.forEach(f=>{h+=formField(f,r)});
  }
  h+='</form>';
  $('#drawerBody').innerHTML=h;
  $('#drawerFoot').innerHTML='';
  const c=document.createElement('button');c.className='btn';c.textContent='Cancelar';c.onclick=()=>closeDrawer();
  const sb=document.createElement('button');sb.className='btn pri';sb.textContent='Guardar';sb.onclick=()=>saveForm(mid,id);
  $('#drawerFoot').append(c,sb);
  FORM0=formSnapshot();
  setTimeout(()=>{const el=$('#f_'+m.fields[1].k);if(el)el.focus()},40);
}

function formField(f,r){
  const v=r[f.k]==null?'':r[f.k];
  const dsc=f.hint?` aria-describedby="h_${f.k}"`:'';
  const req=f.req?' required aria-required="true"':'';
  let h='<div class="field"><label for="f_'+f.k+'">'+esc(f.l)+(f.req?' <abbr title="obligatorio">*</abbr>':'')+'</label>';
  if(f.t==='textarea')h+=`<textarea id="f_${f.k}" name="${f.k}"${dsc}${req}>${esc(v)}</textarea>`;
  else if(f.t==='select')h+=`<select id="f_${f.k}" name="${f.k}"${dsc}${req}><option value="">Sin definir</option>`+f.o.map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')+'</select>';
  else if(f.t==='ref'){
    const opts=DB[f.ref]||[];
    h+=`<select id="f_${f.k}" name="${f.k}"${dsc}${req}><option value="">Sin asignar</option>`+opts.map(o=>`<option value="${o.id}" ${v===o.id?'selected':''}>${esc(o.codigo)} · ${esc(o[MOD[f.ref].titleField]||'')}</option>`).join('')+'</select>';
  }
  else if(f.t==='refs'||f.t==='multiselect'){
    const opts=f.t==='refs'?(DB[f.ref]||[]).map(o=>[o.id,esc(o.codigo)+' · '+esc(o[MOD[f.ref].titleField]||'')]):f.o.map(o=>[o,esc(o)]);
    const arr=Array.isArray(v)?v:[];
    h+=`<div style="max-height:186px;overflow-y:auto;border:1px solid var(--rule-ui);border-radius:5px;padding:8px 10px" role="group" aria-label="${esc(f.l)}">`;
    if(!opts.length)h+='<span style="font-size:12.5px;color:var(--ink-3)">Todavía no hay opciones que elegir.</span>';
    opts.forEach(([val,lab],i)=>{
      h+=`<label style="display:flex;gap:8px;align-items:flex-start;font-weight:400;font-size:13px;padding:3px 0;cursor:pointer">
        <input type="checkbox" name="${f.k}" value="${esc(val)}" ${arr.includes(val)?'checked':''} style="width:auto;margin-top:3px">
        <span>${lab}</span></label>`;
    });
    h+='</div>';
  }
  else h+=`<input id="f_${f.k}" name="${f.k}" type="${f.t==='number'?'number':f.t==='date'?'date':'text'}" value="${esc(v)}"${dsc}${req}>`;
  if(f.hint)h+=`<span class="hint" id="h_${f.k}">${esc(f.hint)}</span>`;
  return h+'</div>';
}

function saveForm(mid,id){
  const m=MOD[mid],frm=$('#frm'),out={};
  m.fields.forEach(f=>{
    if(f.t==='refs'||f.t==='multiselect'){
      out[f.k]=Array.from(frm.querySelectorAll(`input[type=checkbox][name="${f.k}"]:checked`)).map(c=>c.value);
      return;
    }
    const el=frm.elements[f.k];if(!el)return;
    if(f.t==='number')out[f.k]=el.value===''?'':Number(el.value);
    else out[f.k]=el.value.trim?el.value.trim():el.value;
  });
  const missing=m.fields.filter(f=>f.req&&!out[f.k]);
  if(missing.length){
    toast('Falta rellenar «'+missing[0].l+'»');
    const el=$('#f_'+missing[0].k);if(el){el.focus();el.style.borderColor='var(--seal)'}
    return;
  }
  if(out.codigo){
    const dup=DB[mid].some(r=>r.id!==id&&String(r.codigo).toLowerCase()===String(out.codigo).toLowerCase());
    if(dup){toast('Ya existe otro registro con el código '+out.codigo);const el=$('#f_codigo');if(el){el.focus();el.style.borderColor='var(--seal)'}return}
  }
  if(id){
    const r=rec(mid,id);Object.assign(r,out);r._m=today();
  }else{
    out.id=uid();out._c=today();out._m=today();DB[mid].push(out);
  }
  save();
  cloudPush(mid, id?rec(mid,id):out);
  closeDrawer(true);render();toast(id?'Ficha actualizada':'Ficha creada');
}
</script>
<script>
/* ============================ panel de indicadores ============================ */
let PANEL_TABLE=false;

function pct(a,b){return b?Math.round(a*100/b):0}

function renderPanel(){
  if(COLLECTIONS.every(c=>!DB[c].length)){
    $('#view').innerHTML=`<div class="sheet"><div class="sheet-b" style="padding:44px 28px;max-width:640px">
      <h2 style="margin:0 0 10px;font-size:19px">Aún no hay nada registrado</h2>
      <p style="color:var(--ink-2);font-size:14px;margin:0 0 20px">El ciclo empieza por las apps: son las que producen los datos. Después vienen las preguntas que esos datos pueden responder. Si prefieres ver la herramienta con contenido, restaura el ejemplo.</p>
      <div style="display:flex;gap:9px;flex-wrap:wrap">
        <button class="btn pri" onclick="go('apps')">Registrar la primera app</button>
        <button class="btn" onclick="reseed()">Restaurar el ejemplo de Arestora</button>
        <button class="btn" onclick="go('ajustes')">Cargar una copia</button>
      </div></div></div>`;
    return;
  }
  actionBtn(PANEL_TABLE?'Ver gráficos':'Ver tabla',()=>{PANEL_TABLE=!PANEL_TABLE;render()});
  actionBtn('Descargar informe (MD)',()=>exportPanel());

  const AP=DB.apps, PG=DB.preguntas, HA=DB.hallazgos, ME=DB.mejoras;
  const P=DB.proyectos, E=DB.evidencias, S=DB.servicios, PI=DB.propiedad, EC=DB.ecosistema, PL=DB.pilotos, CV=DB.convocatorias;

  const appsConect=AP.filter(a=>['Exportación periódica','Integrada'].includes(a.conexion));
  const pgAbiertas=PG.filter(q=>['Abierta','Esperando datos','En análisis'].includes(q.estado));
  const pgResp=PG.filter(q=>q.estado==='Respondida');
  const haAplic=HA.filter(h=>['Aplicado','Publicado'].includes(h.estado));
  const meImpl=ME.filter(m=>m.estado==='Implantada');

  let h='<div class="tiles">';
  h+=tile(appsConect.length+'<span style="font-size:15px;color:var(--ink-3)">/'+AP.length+'</span>','Apps conectadas','exportan datos al sistema');
  h+=tile(String(pgAbiertas.length),'Preguntas abiertas',pgResp.length+' ya respondidas');
  h+=tile(String(HA.length),'Hallazgos',haAplic.length+' aplicados o publicados');
  h+=tile(String(meImpl.length),'Mejoras implantadas','cambios reales en el producto');
  h+='</div>';

  /* --- el ciclo --- */
  const datos=DB.canonico.length;
  h+='<div class="sheet" style="margin-top:16px"><div class="sheet-h"><span class="eyebrow">El ciclo</span><h2>De la actividad diaria a la innovación</h2></div><div class="sheet-b">';
  h+='<div class="flowline">';
  [['Apps',AP.length,'apps'],['Entidades de datos',datos,'canonico'],['Preguntas',PG.length,'preguntas'],
   ['Hallazgos',HA.length,'hallazgos'],['Mejoras',ME.length,'mejoras']].forEach((x,i)=>{
    if(i)h+='<span class="arrow" aria-hidden="true">→</span>';
    h+=`<button class="step" onclick="go('${x[2]}')"><span class="n">${x[1]}</span><span class="l">${esc(x[0])}</span></button>`;
  });
  h+='</div>';
  const conv=PG.length?Math.round(HA.length*100/PG.length):0;
  const apl=HA.length?Math.round(meImpl.length*100/HA.length):0;
  h+=`<p style="font-size:12.5px;color:var(--ink-2);margin:14px 0 0">
    De cada 100 preguntas, ${conv} han producido un hallazgo. De cada 100 hallazgos, ${apl} han acabado en una mejora implantada.
    ${HA.length&&apl<50?' Ahí está hoy el cuello de botella: se investiga más de lo que se aplica.':''}
    ${PG.length&&!HA.length?' Todavía no hay ningún hallazgo: el sistema está en la fase de acumular preguntas y datos.':''}</p>`;
  h+='</div></div>';

  /* --- lo que hay que resolver --- */
  const al=[];
  HA.filter(x=>['Confirmado','Provisional'].includes(x.estado)&&!ME.some(m=>m.hallazgoId===x.id))
    .forEach(x=>al.push(['crit','Hallazgo sin aplicar: '+(x.titulo||x.codigo)]));
  PG.filter(q=>q.prioridad==='Alta'&&['No, pero es capturable','No, requiere desarrollo'].includes(q.disponibilidad))
    .forEach(q=>al.push(['ser','Falta capturar el dato para: '+(q.pregunta||q.codigo)]));
  AP.filter(a=>a.conexion==='Sin conectar'&&a.estado==='En producción')
    .forEach(a=>al.push(['ser','App en producción sin conectar: '+(a.nombre||a.codigo)]));
  AP.filter(a=>a.aiact==='Por evaluar').forEach(a=>al.push(['warn','Sin evaluar frente al Reglamento de IA: '+(a.nombre||a.codigo)]));
  S.filter(x=>['Sin resolver','En análisis'].includes(x.baseJuridica)).forEach(x=>al.push(['crit','Base jurídica sin cerrar en '+(x.nombre||x.codigo)]));
  PL.filter(x=>x.etica==='Pendiente de solicitar').forEach(x=>al.push(['crit','Dictamen ético sin solicitar en '+(x.titulo||x.codigo)]));
  PI.filter(x=>x.estado==='Sin proteger').forEach(x=>al.push(['warn','Activo sin proteger: '+(x.denominacion||x.codigo)]));
  ME.filter(m=>m.estado==='Implantada'&&!m.efectoMedido).forEach(m=>al.push(['warn','Mejora implantada sin medir el efecto: '+(m.titulo||m.codigo)]));
  CV.filter(c=>c.cierre&&c.cierre>=today()&&daysTo(c.cierre)<=120&&['En vigilancia','En preparación'].includes(c.estado))
    .forEach(c=>al.push(['ser','Cierra en '+daysTo(c.cierre)+' días: '+(c.nombre||c.codigo)]));
  if(al.length){
    h+='<div class="sheet" style="margin-top:16px"><div class="sheet-h"><span class="eyebrow">Atención</span><h2>Lo que hay que resolver</h2>'
      +'<span class="chip st st-crit">'+al.filter(a=>a[0]==='crit').length+' bloqueantes</span></div><div class="sheet-b">';
    al.slice(0,14).forEach(([lvl,txt])=>{
      const c=lvl==='crit'?'st-crit':lvl==='ser'?'st-ser':'st-warn';
      const icon=lvl==='crit'?'▲':lvl==='ser'?'●':'○';
      const pre=lvl==='crit'?'Bloqueante':lvl==='ser'?'Cuello de botella':'Atención';
      h+=`<div style="display:flex;gap:9px;align-items:baseline;padding:5px 0">
        <span class="${c}" aria-hidden="true">${icon}</span>
        <span style="font-size:13.5px"><strong class="${c}">${pre}:</strong> ${esc(txt)}</span></div>`;
    });
    if(al.length>14)h+=`<div style="font-size:12px;color:var(--ink-3);margin-top:8px">y ${al.length-14} más</div>`;
    h+='</div></div>';
  }

  if(PANEL_TABLE){
    h+=panelTable(P,E);
  }else{
    h+='<div class="viz-root">';
    h+=chartBars('Preguntas abiertas por línea',DB.lineas.map((l,i)=>({
      label:l.nombre,value:pgAbiertas.filter(q=>q.lineaId===l.id).length,color:`var(${SERIES[i%SERIES.length]})`})),'preguntas sin responder');
    h+=chartBars('Datos que faltan por app',AP.map((a,i)=>({
      label:a.nombre,value:PG.filter(q=>(q.apps||[]).includes(a.id)&&['No, pero es capturable','No, requiere desarrollo'].includes(q.disponibilidad)).length,
      color:'var(--s2)'})),'preguntas bloqueadas esperando que esa app capture el dato');
    h+=chartStack('Cartera por línea',P);
    const trlRows=P.filter(p=>p.trlAct).sort((a,b)=>Number(b.trlAct)-Number(a.trlAct))
      .map(p=>({label:p.codigo+' '+(p.titulo||''),value:Number(p.trlAct),max:9,color:lineColor(p.lineaId),suffix:'/9'}));
    if(trlRows.length)h+=chartBars('Madurez tecnológica alcanzada',trlRows,'TRL',9);
    h+='</div>';
  }
  $('#view').innerHTML=h;
}
function tile(v,k,s,plain){
  const val=plain?`<span style="font-family:var(--sans);font-size:20px;font-weight:660">${esc(v)}</span>`:v;
  return `<div class="tile"><div class="v">${val}</div><div class="k">${esc(k)}</div><div class="s">${esc(s||'')}</div></div>`;
}
function daysTo(d){return Math.ceil((new Date(d)-new Date(today()))/86400000)}

function chartStack(title,P){
  const parts=DB.lineas.map((l,i)=>({name:l.nombre,n:P.filter(p=>p.lineaId===l.id).length,c:`var(${SERIES[i%SERIES.length]})`}))
    .concat([{name:'Transversal',n:P.filter(p=>!p.lineaId).length,c:'var(--ink-3)'},
             {name:'Línea eliminada',n:P.filter(p=>p.lineaId&&!rec('lineas',p.lineaId)).length,c:'var(--critical)'}])
    .filter(x=>x.n>0);
  const tot=parts.reduce((a,x)=>a+x.n,0);
  if(!tot)return '';
  let h=`<div class="sheet" style="margin-top:16px"><div class="sheet-h"><span class="eyebrow">Cartera</span><h2>${esc(title)}</h2></div><div class="sheet-b">`;
  h+='<div class="stackbar">'+parts.map(p=>`<span style="background:${p.c};width:${p.n*100/tot}%" title="${esc(p.name)}: ${p.n}"></span>`).join('')+'</div>';
  h+='<div class="legend">'+parts.map(p=>`<i><b style="background:${p.c}"></b>${esc(p.name)} <span style="font-family:var(--mono);color:var(--ink-3)">${p.n}</span></i>`).join('')+'</div>';
  h+='</div></div>';
  return h;
}
function chartBars(title,rows,unit,forcedMax){
  rows=rows.filter(r=>r.value>0);
  if(!rows.length)return '';
  const max=forcedMax||Math.max(...rows.map(r=>r.value));
  let h=`<div class="sheet" style="margin-top:16px"><div class="sheet-h"><span class="eyebrow">Indicador</span><h2>${esc(title)}</h2></div><div class="sheet-b">`;
  rows.forEach(r=>{
    h+=`<div class="barrow"><span class="lb" title="${esc(r.label)}">${esc(r.label)}</span>
      <span class="track"><span class="fill" style="width:${Math.max(2,r.value*100/max)}%;background:${r.color||'var(--s1)'}"></span></span>
      <span class="vl">${r.value}${r.suffix||''}</span></div>`;
  });
  h+=`<div style="font-size:11.5px;color:var(--ink-3);margin-top:6px">${esc(unit||'')}</div></div></div>`;
  return h;
}
function chartCalls(CV){
  const rows=CV.filter(c=>Array.isArray(c.criterios)&&c.criterios.length).map(c=>{
    const tot=c.criterios.reduce((a,x)=>a+(Number(x.max)||0),0);
    const got=c.criterios.reduce((a,x)=>a+(Number(x.auto)||0),0);
    return {label:c.nombre,value:tot?Math.round(got*100/tot):0,color:'var(--s1)',suffix:'%'};
  });
  if(!rows.length)return '';
  return chartBars('Autoevaluación por convocatoria',rows,'Porcentaje del baremo cubierto según estimación propia, no puntuación oficial',100);
}
function panelTable(P,E){
  let h='<div class="sheet" style="margin-top:16px"><div class="sheet-h"><span class="eyebrow">Tabla</span><h2>Los mismos datos en texto</h2></div>';
  h+='<div class="sheet-b" style="overflow-x:auto"><table class="data"><tr><th>Línea</th><th class="num">Proyectos</th><th class="num">Evidencias</th><th class="num">Servicios</th><th class="num">Pilotos</th></tr>';
  DB.lineas.forEach(l=>{
    h+=`<tr><td><strong>${esc(l.nombre)}</strong></td>
      <td class="num">${P.filter(p=>p.lineaId===l.id).length}</td>
      <td class="num">${E.filter(e=>e.lineaId===l.id).length}</td>
      <td class="num">${DB.servicios.filter(s=>s.lineaId===l.id).length}</td>
      <td class="num">${DB.pilotos.filter(p=>{const pr=rec('proyectos',p.proyectoId);return pr&&pr.lineaId===l.id}).length}</td></tr>`;
  });
  const huerf=P.filter(p=>p.lineaId&&!rec('lineas',p.lineaId)).length;
  if(huerf)h+=`<tr><td><strong>Línea eliminada</strong></td><td class="num">${huerf}</td><td class="num">—</td><td class="num">—</td><td class="num">—</td></tr>`;
  h+=`<tr><td><strong>Transversal</strong></td><td class="num">${P.filter(p=>!p.lineaId).length}</td><td class="num">${E.filter(e=>!e.lineaId).length}</td><td class="num">${DB.servicios.filter(s=>!s.lineaId).length}</td><td class="num">—</td></tr>`;
  h+='</table></div></div>';
  h+='<div class="sheet"><div class="sheet-h"><span class="eyebrow">Tabla</span><h2>Madurez por proyecto</h2></div><div class="sheet-b" style="overflow-x:auto">';
  h+='<table class="data"><tr><th>Código</th><th>Proyecto</th><th>Estado</th><th class="num">TRL actual</th><th class="num">TRL objetivo</th></tr>';
  P.forEach(p=>{h+=`<tr><td><strong>${esc(p.codigo)}</strong></td><td>${esc(p.titulo||'')}</td><td>${esc(p.estado||'—')}</td><td class="num">${esc(p.trlAct||'—')}</td><td class="num">${esc(p.trlObj||'—')}</td></tr>`});
  h+='</table></div></div>';
  return h;
}

/* ============================ convocatorias y baremo ============================ */
function renderCalls(){
  const m=MOD.convocatorias;
  actionBtn('Descargar CSV',()=>exportCSV('convocatorias'));
  actionBtn('Nueva convocatoria',()=>openForm('convocatorias',null),'pri');
  const rows=applyFilter(m,DB.convocatorias);
  let h=filterBar(m);
  h+='<div class="sheet"><div class="sheet-h"><span class="eyebrow">CV</span><h2>Radar de convocatorias</h2><span class="chip">'+rows.length+' de '+DB.convocatorias.length+'</span></div>';
  if(!rows.length){
    h+='<div class="empty"><p>No hay convocatorias en el radar.</p><button class="btn pri" onclick="openForm(\'convocatorias\',null)">Añadir la primera convocatoria</button></div>';
  }else{
    rows.sort((a,b)=>(a.cierre||'9999')<(b.cierre||'9999')?-1:1).forEach(c=>{
      const cr=c.criterios||[];
      const tot=cr.reduce((a,x)=>a+(Number(x.max)||0),0);
      const got=cr.reduce((a,x)=>a+(Number(x.auto)||0),0);
      const cov=cr.length?pct(cr.filter(x=>(x.evidencias||[]).length).length,cr.length):0;
      h+=`<div class="rec" data-call="${c.id}" tabindex="0" role="button" aria-label="Abrir convocatoria ${esc(c.codigo||'')} ${esc(c.nombre||'')}">
        <span class="id">${esc(c.codigo)}</span>
        <div><p class="t">${esc(c.nombre)}</p>
          <p class="d">${esc(c.organismo||'')}${c.modalidad?' · '+esc(c.modalidad):''}</p>
          <div class="meta">
            <span>${c.cierre?('Cierra '+fd(c.cierre)):'Sin fecha de cierre'}</span>
            ${tot?`<span>Autoevaluación ${got} de ${tot}</span>`:'<span>Baremo sin definir</span>'}
            ${cr.length?`<span>${cov}% de criterios con evidencia</span>`:''}
          </div></div>
        <div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end">
          <span class="chip">${esc(c.ambito||'—')}</span>
          <span class="chip st ${statusClass(m,'estado',c.estado)}">${esc(c.estado||'—')}</span>
        </div></div>`;
    });
  }
  h+='</div>';
  $('#view').innerHTML=h;
  wireRows('[data-call]',el=>{VIEW='call:'+el.dataset.call;buildNav();renderCall(el.dataset.call)});
  wireFilterBar(m);
}

function renderCall(id){
  const c=rec('convocatorias',id);
  if(!c){go('convocatorias');return}
  c.criterios=c.criterios||[];
  $('#viewTitle').textContent=c.nombre;
  $('#viewSub').textContent=(c.organismo||'')+(c.modalidad?' · '+c.modalidad:'');
  $('#viewActions').innerHTML='';
  actionBtn('Volver',()=>go('convocatorias'));
  actionBtn('Eliminar',()=>{
    if(confirm('Se elimina esta convocatoria y su baremo, y no se puede deshacer. ¿Continuar?')){
      DB.convocatorias=DB.convocatorias.filter(x=>x.id!==id);save();cloudDelete('convocatorias',id);go('convocatorias');toast('Convocatoria eliminada');
    }
  },'dgr');
  actionBtn('Editar datos',()=>openForm('convocatorias',id));
  actionBtn('Descargar dossier (MD)',()=>exportDossier(id),'pri');

  const tot=c.criterios.reduce((a,x)=>a+(Number(x.max)||0),0);
  const got=c.criterios.reduce((a,x)=>a+(Number(x.auto)||0),0);
  const sinEv=c.criterios.filter(x=>!(x.evidencias||[]).length);

  let h='<div class="tiles">';
  h+=tile(String(got)+'<span style="font-size:15px;color:var(--ink-3)">/'+tot+'</span>','Autoevaluación','estimación propia, no puntuación oficial');
  h+=tile(esc(c.obtenida!==''&&c.obtenida!=null?String(c.obtenida):'—'),'Puntuación obtenida',c.corte?('Corte en '+c.corte):'Sin dato de corte');
  h+=tile(String(c.criterios.length-sinEv.length)+'<span style="font-size:15px;color:var(--ink-3)">/'+c.criterios.length+'</span>','Criterios con evidencia',sinEv.length?(sinEv.length+' sin respaldo documental'):'todos respaldados');
  if(c.cierre&&daysTo(c.cierre)<0)h+=tile('Cerrada','Plazo','Cerró el '+fmtDate(c.cierre),true);
  else h+=tile(c.cierre?(daysTo(c.cierre)+' d'):'—','Hasta el cierre',c.cierre?fmtDate(c.cierre):'Fecha sin fijar');
  h+='</div>';

  h+='<div class="sheet" style="margin-top:16px"><div class="sheet-h"><span class="eyebrow">Baremo</span><h2>Criterios de valoración</h2>'
    +'<div style="flex:1"></div><button class="btn sm" id="addCrit">Añadir criterio</button></div><div class="sheet-b">';
  if(!c.criterios.length){
    h+='<div class="empty" style="padding:24px 0"><p>El baremo de esta convocatoria todavía no está cargado. Cárgalo una vez y la candidatura se construye vinculando evidencias.</p></div>';
  }else{
    c.criterios.forEach((cr,i)=>{
      const ev=(cr.evidencias||[]);
      const mx=Math.max(0,Number(cr.max)||0), au=Math.min(mx,Math.max(0,Number(cr.auto)||0));
      const p=mx?Math.round(au*100/mx):0;
      const col=p>=70?'var(--good)':p>=40?'var(--warning)':'var(--critical)';
      h+=`<div style="padding:14px 0;border-bottom:1px solid var(--rule)">
        <div class="crit-row" style="border:0;padding:0">
          <div><div style="font-weight:600;font-size:13.5px">${esc(cr.codigo||'')} ${esc(cr.nombre||'Criterio')}</div>
            <div style="font-size:12px;color:var(--ink-2)">${ev.length?ev.length+' evidencia'+(ev.length>1?'s':'')+' vinculada'+(ev.length>1?'s':''):'Sin evidencia vinculada'}</div></div>
          <div><label class="sr-only" for="crit_${i}_auto">Autoevaluación del criterio ${esc(cr.nombre||'')}</label>
            <input id="crit_${i}_auto" type="number" min="0" step="0.25" value="${esc(cr.auto==null?'':cr.auto)}" data-ci="${i}" data-cf="auto" style="text-align:right"></div>
          <div style="display:flex;align-items:center;gap:6px"><span style="color:var(--ink-2);font-size:12px">de</span>
            <label class="sr-only" for="crit_${i}_max">Puntuación máxima del criterio ${esc(cr.nombre||'')}</label>
            <input id="crit_${i}_max" type="number" min="0" step="0.25" value="${esc(cr.max==null?'':cr.max)}" data-ci="${i}" data-cf="max" style="text-align:right"></div>
        </div>
        <div class="track" style="margin:9px 0 3px" aria-hidden="true"><span class="fill" style="width:${p}%;background:${col}"></span></div>
        <div class="pctlbl">${au} de ${mx} · ${p} %</div>
        <div class="field" style="margin:10px 0 9px"><label for="crit_${i}_texto">Argumentario</label>

          </div></div>
        <button class="btn sm dgr" data-del="${i}" style="margin-top:9px">Quitar criterio</button>
      </div>`;
    });
  }
  h+='</div></div>';

  if(c.objeto||c.requisitos||c.notas){
    h+='<div class="sheet"><div class="sheet-h"><span class="eyebrow">Ficha</span><h2>Condiciones</h2></div><div class="sheet-b">';
    if(c.objeto)h+=`<div style="margin-bottom:13px"><div class="eyebrow">Objeto</div><div>${nl(c.objeto)}</div></div>`;
    if(c.requisitos)h+=`<div style="margin-bottom:13px"><div class="eyebrow">Requisitos y gastos elegibles</div><div>${nl(c.requisitos)}</div></div>`;
    if(c.url)h+=`<div style="margin-bottom:13px"><div class="eyebrow">Bases</div><div style="word-break:break-all;font-size:13px">${esc(c.url)}</div></div>`;
    if(c.notas)h+=`<div><div class="eyebrow">Notas</div><div>${nl(c.notas)}</div></div>`;
    h+='</div></div>';
  }
  $('#view').innerHTML=h;

  const add=$('#addCrit');
  if(add)add.onclick=()=>{c.criterios.push({codigo:'',nombre:'Nuevo criterio',max:10,auto:0,texto:'',evidencias:[]});save();cloudPush('convocatorias',c);renderCall(id)};
  $('#view').querySelectorAll('[data-ci]').forEach(el=>{
    const i=Number(el.dataset.ci),f=el.dataset.cf;
    el.onchange=()=>{
      const cr=c.criterios[i];if(!cr)return;
      if(f==='evidencias'){
        cr.evidencias=Array.from($('#view').querySelectorAll(`input[data-ci="${i}"][data-cf="evidencias"]:checked`)).map(x=>x.value);
      }else if(f==='texto'){
        cr.texto=el.value;
      }else{
        let n=el.value===''?0:Number(el.value);
        if(isNaN(n)||n<0)n=0;
        if(f==='auto'){cr.auto=Math.min(n,Math.max(0,Number(cr.max)||0))}
        else{cr.max=n;cr.auto=Math.min(Math.max(0,Number(cr.auto)||0),n)}
      }
      save();cloudPush('convocatorias',c);
      if(f!=='texto'&&f!=='evidencias')renderCall(id);
    };
  });
  $('#view').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(confirm('¿Quitar este criterio del baremo?')){c.criterios.splice(Number(b.dataset.del),1);save();cloudPush('convocatorias',c);renderCall(id)}
  });
}

/* El catálogo del Hub y el registro de apps del Lab son la misma información vista
   de dos maneras. La fuente es esta: el Hub se regenera desde aquí. */

function slugId(nombre){
  return String(nombre||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[®™]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'').trim();
}
function contrasteBlanco(hex){
  const m=/^#?([0-9a-f]{6})$/i.exec(String(hex||'').trim());
  if(!m)return null;
  const n=parseInt(m[1],16);
  const c=[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]
    .map(v=>v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4));
  const L=0.2126*c[0]+0.7152*c[1]+0.0722*c[2];
  return Math.round(((1.05)/(L+0.05))*100)/100;
}

function fichaHub(a){
  return {
    id: slugId(a.nombre),
    nombre: a.nombre||'',
    descripcion: (a.proposito||'').split('\n')[0],
    sector: a.sector||'',
    estado: ESTADO_HUB[a.estado]||'',
    color: a.color||'',
    url: a.url||'',
    repo: a.repo||'',
    carpeta: a.carpeta||'',
    stack: a.stack||'',
    acceso: Array.isArray(a.acceso)?a.acceso:[],
    notas: a.notas||''
  };
}

/* ---------- lectura del catálogo del Hub ---------- */
const E2L={activo:'En producción',en_proceso:'En desarrollo',proximamente:'En diseño',idea:'Idea',archivado:'Retirada'};
const L2E={'En producción':'activo','En desarrollo':'en_proceso','En rediseño':'en_proceso','En diseño':'proximamente','Idea':'idea','Retirada':'archivado'};

function importarCatalogo(cat,silencioso){
  if(!cat||!Array.isArray(cat.espacios))throw new Error('formato');
  let nuevas=0,actualizadas=0;
  DB.meta.hub={meta:cat.meta,estados:cat.estados,
    espacios:cat.espacios.map(e=>({id:e.id,nombre:e.nombre,descripcion:e.descripcion,color:e.color,logo:e.logo}))};
  cat.espacios.forEach(esp=>{
    (esp.herramientas||[]).forEach(h=>{
      if(!h||!h.id)return;
      let a=DB.apps.find(x=>x.hubId===h.id)||DB.apps.find(x=>slugId(x.nombre)===slugId(h.nombre));
      const esNueva=!a;
      if(esNueva){a={id:uid(),_c:today(),codigo:nextCode('apps'),conexion:'Sin conectar',aiact:'Por evaluar'};DB.apps.push(a);nuevas++}
      else actualizadas++;
      Object.assign(a,{
        hubId:h.id,nombre:h.nombre||a.nombre,espacio:esp.nombre||'',
        proposito:h.descripcion||a.proposito||'',
        sector:h.sector||a.sector||'',
        estado:E2L[h.estado]||a.estado||'',
        color:h.color||a.color||'',
        url:h.url||'',repo:h.repo||a.repo||'',
        carpeta:h.carpeta||a.carpeta||'',
        stack:h.stack||a.stack||'',
        acceso:Array.isArray(h.acceso)&&h.acceso.length?h.acceso:(a.acceso||[]),
        logo:h.logo||a.logo||'',emoji:h.emoji||a.emoji||'',
        _m:today()
      });
      if(h.notas&&!a.notas)a.notas=h.notas;
    });
  });
  save();
  if(!silencioso){buildNav();render();toast('Catálogo del Hub incorporado: '+nuevas+' nuevas y '+actualizadas+' actualizadas')}
  return {nuevas,actualizadas};
}

async function leerCatalogoDelHub(){
  if(!/^https?:$/.test(location.protocol))return false;
  for(const ruta of ['../catalogo.json','catalogo.json','../_HUB/catalogo.json']){
    try{
      const r=await fetch(ruta,{cache:'no-store'});
      if(!r.ok)continue;
      const cat=await r.json();
      if(!cat||!Array.isArray(cat.espacios))continue;
      const res=importarCatalogo(cat,true);
      DB.meta.hubOrigen=ruta;DB.meta.hubLeido=new Date().toISOString();
      save();
      return res;
    }catch(e){}
  }
  return false;
}

function exportHub(){
  const guardado=DB.meta.hub||{};
  const metaBase=guardado.meta||{
    marca:'Arestora Hub',organizacion:'Grupo Arestora',version:'2.1',
    nota:'FUENTE ÚNICA DE VERDAD. Para añadir o cambiar una herramienta, edítala en el Innovation Lab y vuelve a exportar este fichero. No toques el HTML a mano.',
    roles:{admin:'Dirección de Grupo Arestora',gestor:'Equipo interno de Arestora',cliente:'Entidad contratante',
      rb:'Responsable de Bienestar (deporte)',cbp:'Coordinador de Bienestar y Protección (educación)',
      candidato:'Persona candidata (AresJobs)',empresa:'Empresa que publica ofertas (AresJobs)'},
    nota_permisos:'El campo «acceso» es informativo en el Hub. La autorización real la valida cada herramienta en su propio backend: el Hub es escaparate, no puerta.'
  };
  const meta=Object.assign({},metaBase,{actualizado:today(),origen:'Innovation Lab OS'});
  const estados=guardado.estados||{activo:{etiqueta:'ACTIVO',orden:1},en_proceso:{etiqueta:'EN PROCESO',orden:2},
    proximamente:{etiqueta:'PRÓXIMAMENTE',orden:3},idea:{etiqueta:'IDEA',orden:4},archivado:{etiqueta:'ARCHIVADO',orden:5}};

  const defsEsp=guardado.espacios||[];
  const orden=defsEsp.map(e=>e.nombre);
  const grupos={};
  const avisos=[];
  DB.apps.forEach(a=>{
    if(a.estado==='Retirada')return;
    const nombreEsp=a.espacio||'Otras herramientas';
    (grupos[nombreEsp]=grupos[nombreEsp]||[]).push(a);
    if(!L2E[a.estado])avisos.push(a.nombre+': sin estado, no se puede traducir al vocabulario del Hub');
    if(a.estado==='En producción'&&!a.url)avisos.push(a.nombre+': marcada como activa y sin dirección');
    if(!a.color)avisos.push(a.nombre+': sin color');
    else{
      const r=contrasteBlanco(a.color);
      if(r===null)avisos.push(a.nombre+': el color no es un hexadecimal de seis dígitos');
      else if(r<3)avisos.push(a.nombre+': color con contraste '+r+':1 sobre blanco, por debajo de 3:1');
    }
    if(!(a.acceso||[]).length)avisos.push(a.nombre+': sin roles de acceso documentados');
    if(!a.logo&&!a.emoji)avisos.push(a.nombre+': sin logotipo ni icono en el Hub');
  });

  const nombres=Object.keys(grupos).sort((x,y)=>{
    const a=orden.indexOf(x),b=orden.indexOf(y);
    return (a<0?99:a)-(b<0?99:b);
  });
  const espacios=nombres.map(n=>{
    const d=defsEsp.find(e=>e.nombre===n)||{};
    return {
      id:d.id||slugId(n),nombre:n,
      descripcion:d.descripcion||'',color:d.color||grupos[n][0].color||'#1B4FD8',
      logo:d.logo||'',
      herramientas:grupos[n].map(a=>{
        const h={
          id:a.hubId||slugId(a.nombre),
          nombre:a.nombre||'',
          descripcion:(a.proposito||'').split('\n')[0],
          sector:a.sector||'',
          estado:L2E[a.estado]||'',
          color:a.color||'',
          url:a.url||'',repo:a.repo||'',carpeta:a.carpeta||'',
          stack:a.stack||'',
          notas:a.notas||'',
          acceso:Array.isArray(a.acceso)?a.acceso:[]
        };
        if(a.logo)h.logo=a.logo;
        if(a.emoji)h.emoji=a.emoji;
        return h;
      })
    };
  });

  dl('catalogo.json',JSON.stringify({meta,estados,espacios},null,1),'application/json');
  const n=espacios.reduce((s,e)=>s+e.herramientas.length,0);
  if(avisos.length){
    openDrawer('Catálogo descargado, con avisos');
    $('#drawerBody').innerHTML='<p style="margin-top:0;font-size:13.5px;color:var(--ink-2)">'+espacios.length+' espacios y '+n+' herramientas. El fichero es válido, pero estas fichas van incompletas:</p>'
      +[...new Set(avisos)].map(x=>`<div style="padding:5px 0;border-bottom:1px solid var(--rule);font-size:13px">${esc(x)}</div>`).join('')
      +'<p style="font-size:12.5px;color:var(--ink-3);margin-top:14px">Sustituye con él el <code>catalogo.json</code> del Hub y ejecuta <code>generar_hub.py</code>. Un campo vacío es preferible a un dato inventado.</p>';
    $('#drawerFoot').innerHTML='';
    const b=document.createElement('button');b.className='btn pri';b.textContent='Entendido';b.onclick=()=>closeDrawer(true);
    $('#drawerFoot').appendChild(b);
  }else{
    toast('Catálogo descargado: '+espacios.length+' espacios, '+n+' herramientas');
  }
}

    toast((nueva?'App incorporada: ':'App actualizada: ')+a.nombre+(roles.length?' · rol nuevo sin declarar: '+roles.join(', '):''));

}

        const d=JSON.parse(rd.result);

        if(!COLLECTIONS.some(c=>Array.isArray(d[c])))throw new Error('formato');
        const sano=(d.meta&&typeof d.meta.org==='string')||
          COLLECTIONS.some(c=>Array.isArray(d[c])&&d[c].some(r=>r&&typeof r==='object'&&!Array.isArray(r)));
        if(!sano)throw new Error('contenido');
        cand=migrate(JSON.parse(JSON.stringify(d)));
      }catch(err){
        toast('Ese fichero no es una copia de Innovation Lab OS. Debe ser un .json descargado con «Descargar copia».');

      try{
        paintOrg();VIEW='panel';buildNav();render();
        save();toast('Copia cargada');
        if(CLOUD)cloudReplaceAll();
      }catch(err2){
        DB=prev;paintOrg();VIEW='ajustes';buildNav();render();
        toast('Esa copia está dañada y no se ha cargado. Tus datos siguen intactos.');
      }
      e.target.value='';
    };
    rd.readAsText(f);
  };
}

function dl(name,text,mime){
  const b=new Blob([text],{type:(mime||'text/plain')+';charset=utf-8'});
  const u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},400);
}
function stamp(){return today().replace(/-/g,'')}
function exportJSON(){dl('lab-os-'+stamp()+'.json',JSON.stringify(DB,null,2),'application/json');toast('Copia descargada')}

function csvOf(mid){
  const m=MOD[mid];
  const cols=m.fields.map(f=>f.k);
  const head=m.fields.map(f=>f.l);
  const q=v=>{
    let t=String(v==null?'':v);
    if(/^[=+\-@\t\r]/.test(t))t="'"+t;
    return '"'+t.replace(/"/g,'""')+'"';
  };
  const lines=[head.map(q).join(';')];
  DB[mid].forEach(r=>{
    lines.push(cols.map(k=>{
      const f=m.fields.find(x=>x.k===k),v=r[k];
      if(f.t==='ref')return q(recTitle(f.ref,v));
      if(f.t==='refs')return q((v||[]).map(x=>recTitle(f.ref,x)).join(' | '));
      if(f.t==='multiselect')return q((v||[]).join(' | '));
      return q(v);
    }).join(';'));
  });
  return '﻿'+lines.join('\r\n');
}
function exportCSV(mid){dl(mid+'-'+stamp()+'.csv',csvOf(mid),'text/csv');toast('CSV descargado')}
function exportAllCSV(){COLLECTIONS.forEach((c,i)=>setTimeout(()=>dl(c+'-'+stamp()+'.csv',csvOf(c),'text/csv'),i*250));toast('Descargando '+COLLECTIONS.length+' ficheros')}

function mdField(l,v){return v?`\n**${l}**\n\n${v}\n`:''}
function exportProject(pid){
  const p=rec('proyectos',pid);if(!p)return;
  const m=MOD.proyectos;
  let t=`# ${p.codigo} — ${p.titulo}\n\n_${DB.meta.org} · ficha de proyecto generada el ${fmtDate(today())}_\n`;
  m.fields.forEach(f=>{
    if(['codigo','titulo'].includes(f.k))return;
    let v=p[f.k];if(v==null||v===''||(Array.isArray(v)&&!v.length))return;
    if(f.t==='ref')v=recTitle(f.ref,v);
    else if(f.t==='refs')v=v.map(x=>recTitle(f.ref,x)).join(', ');
    else if(f.t==='multiselect')v=v.join(', ');
    else if(f.t==='date')v=fmtDate(v);
    t+=mdField(f.l,v);
  });
  const ev=DB.evidencias.filter(e=>e.proyectoId===pid);
  if(ev.length){
    t+='\n**Evidencias**\n\n';
    ev.forEach(e=>{t+=`- ${e.codigo} · ${e.titulo} (${e.tipo||'—'}, ${fmtDate(e.fecha)}) — ${e.ubicacion||'ubicación sin indicar'}\n`});
  }
  const pl=DB.pilotos.filter(x=>x.proyectoId===pid);
  if(pl.length){
    t+='\n**Pilotos y validaciones**\n\n';
    pl.forEach(x=>{t+=`- ${x.codigo} · ${x.titulo} — ${x.diseno||'diseño sin definir'}, estado: ${x.estado||'—'}\n`});
  }
  dl(p.codigo+'-'+stamp()+'.md',t,'text/markdown');toast('Ficha de proyecto descargada');
}
function exportDossier(cid){
  const c=rec('convocatorias',cid);if(!c)return;
  const cr=c.criterios||[];
  const tot=cr.reduce((a,x)=>a+(Number(x.max)||0),0),got=cr.reduce((a,x)=>a+(Number(x.auto)||0),0);
  let t=`# Dossier de candidatura — ${c.nombre}\n\n_${DB.meta.org} · ${fmtDate(today())}_\n\n`;
  t+=`Organismo: ${c.organismo||'—'} · Ámbito: ${c.ambito||'—'} · Modalidad: ${c.modalidad||'—'}\n\n`;
  t+=`Cierre de plazo: ${fmtDate(c.cierre)} · Autoevaluación: ${got} de ${tot}\n`;
  if(c.proyectoId)t+=`\nProyecto candidato: ${recTitle('proyectos',c.proyectoId)}\n`;
  if(c.objeto)t+=`\n## Objeto\n\n${c.objeto}\n`;
  t+='\n## Criterios, argumentario y evidencias\n';
  cr.forEach(x=>{
    t+=`\n### ${x.codigo||''} ${x.nombre||'Criterio'} — ${x.auto||0} de ${x.max||0}\n`;
    t+=`\n${x.texto||'_Argumentario pendiente de redactar._'}\n`;
    const ev=(x.evidencias||[]).map(id=>rec('evidencias',id)).filter(Boolean);
    if(ev.length){
      t+='\nEvidencias:\n\n';
      ev.forEach(e=>{t+=`- ${e.codigo} · ${e.titulo} (${e.tipo||'—'}, ${fmtDate(e.fecha)}) — ${e.descripcion||''} [${e.ubicacion||'sin ubicación'}]\n`});
    }else{
      t+='\n> Sin evidencia vinculada. Este criterio se defiende hoy solo con el relato.\n';
    }
  });
  const sin=cr.filter(x=>!(x.evidencias||[]).length);
  if(sin.length){
    t+=`\n## Puntos débiles\n\n${sin.length} criterio(s) sin respaldo documental: ${sin.map(x=>x.nombre).join(', ')}.\n`;
  }
  if(c.requisitos)t+=`\n## Requisitos y gastos elegibles\n\n${c.requisitos}\n`;
  dl('dossier-'+(c.codigo||'cv')+'-'+stamp()+'.md',t,'text/markdown');toast('Dossier descargado');
}
function exportPanel(){
  const P=DB.proyectos,E=DB.evidencias,S=DB.servicios;
  let t=`# ${DB.meta.org} — situación a ${fmtDate(today())}\n\n`;

  t+=`Activos de propiedad intelectual registrados: ${DB.propiedad.filter(x=>x.estado==='Registrado').length} de ${DB.propiedad.length}\n`;

  t+=`Horas imputadas: ${P.reduce((a,p)=>a+(Number(p.horas)||0),0)}\n\n## Cartera\n\n`;
  P.forEach(p=>{t+=`- **${p.codigo}** ${p.titulo} · ${recTitle('lineas',p.lineaId)} · ${p.estado||'—'} · TRL ${p.trlAct||'—'}→${p.trlObj||'—'}\n`});
  t+='\n## Convocatorias en radar\n\n';

  dl('situacion-'+stamp()+'.md',t,'text/markdown');toast('Informe descargado');
}

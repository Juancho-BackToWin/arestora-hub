<script>
/* ============================================================
   CAPA DE NUBE — opcional
   Sin configurar, la aplicación funciona igual que siempre:
   los datos viven en este navegador.
   Con SUPABASE configurado, el departamento entero comparte
   los mismos registros y cada ficha lleva quién la tocó.
   ============================================================ */

/* ---- CONFIGURACIÓN ----
   Rellena estos dos valores para activar el modo compartido.
   La clave "anon" de Supabase es pública por diseño: no es un
   secreto. Quien protege los datos es la lista de correos
   autorizados y las políticas de seguridad del esquema SQL. */
const SUPABASE_URL = '';        // ej.: https://xxxxxxxx.supabase.co
const SUPABASE_ANON_KEY = '';   // ej.: eyJhbGciOi...

const CLOUD = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
let sb=null, ME=null, PULLING=false;

/* ---------- carga del cliente ---------- */
const CDN=[
  'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js',
  'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'
];
function cargarSupabase(i){
  i=i||0;
  return new Promise((ok,err)=>{
    if(window.supabase&&window.supabase.createClient){ok();return}
    if(i>=CDN.length){err(new Error('sin librería'));return}
    const s=document.createElement('script');
    s.src=CDN[i];
    s.onload=()=>{window.supabase?ok():cargarSupabase(i+1).then(ok,err)};
    s.onerror=()=>{s.remove();cargarSupabase(i+1).then(ok,err)};
    document.head.appendChild(s);
  });
}
function avisoSinConexion(){
  const d=document.createElement('div');
  d.className='note seal';
  d.style.cssText='margin:16px 24px 0;border-left-color:var(--seal)';
  d.innerHTML='<strong>Sin conexión con el servidor compartido.</strong> Estás trabajando sobre la copia guardada en este navegador. Lo que registres ahora no lo verán los demás: cuando vuelva la conexión, recarga la página y súbelo desde Datos y ajustes.';
  const main=document.querySelector('main');
  main.insertBefore(d,main.children[1]);
}

/* ---------- pantalla de acceso ---------- */
function pantallaAcceso(mensaje,tipo){
  document.getElementById('app').style.display='none';
  let box=document.getElementById('login');
  if(!box){
    box=document.createElement('div');box.id='login';
    box.style.cssText='min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px';
    document.body.appendChild(box);
  }
  box.innerHTML=`
    <div class="sheet" style="max-width:430px;width:100%;padding:30px 32px">
      <span class="eyebrow">Innovation Lab OS</span>
      <h1 style="font-size:21px;margin:8px 0 6px;font-weight:700">Acceso al departamento</h1>
      <p style="color:var(--ink-2);font-size:13.5px;margin:0 0 20px">
        Escribe tu correo del Grupo. Te llega un enlace de acceso: al pulsarlo entras, sin contraseña.</p>
      <div class="field"><label for="mail">Correo electrónico</label>
        <input id="mail" type="text" inputmode="email" placeholder="nombre@grupoarestora.com"></div>
      <button class="btn pri" id="entrar" style="width:100%">Enviarme el enlace</button>
      <div id="msg" style="margin-top:14px;font-size:13px;min-height:20px;color:${tipo==='err'?'var(--seal)':'var(--ink-2)'}">${esc(mensaje||'')}</div>
      <p style="font-size:11.5px;color:var(--ink-3);margin:18px 0 0;line-height:1.5">
        Solo entran los correos dados de alta por la dirección del Lab. Si el tuyo no lo está, el enlace llegará pero el acceso se rechazará.</p>
    </div>`;
  const mail=document.getElementById('mail'), btn=document.getElementById('entrar'), msg=document.getElementById('msg');
  const enviar=async()=>{
    const email=mail.value.trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){msg.style.color='var(--seal)';msg.textContent='Ese correo no parece válido.';return}
    btn.disabled=true;btn.textContent='Enviando…';
    const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('#')[0]}});
    btn.disabled=false;btn.textContent='Enviarme el enlace';
    if(error){msg.style.color='var(--seal)';msg.textContent='No se pudo enviar: '+error.message;return}
    msg.style.color='var(--ink-2)';
    msg.textContent='Enlace enviado a '+email+'. Revisa el correo, y también la carpeta de no deseado.';
  };
  btn.onclick=enviar;
  mail.onkeydown=e=>{if(e.key==='Enter')enviar()};
  mail.focus();
}
function cerrarAcceso(){
  const box=document.getElementById('login');if(box)box.remove();
  document.getElementById('app').style.display='';
}

/* ---------- lectura y escritura ---------- */
async function cloudPull(silencioso){
  if(!CLOUD||!sb||PULLING)return;
  PULLING=true;
  try{
    const {data,error}=await sb.from('registros').select('id,coleccion,datos,modificado,modificado_por');
    if(error)throw error;
    const nuevo=blankDB();
    (data||[]).forEach(r=>{
      if(!COLLECTIONS.includes(r.coleccion))return;
      const d=r.datos||{};d.id=r.id;d._m=(r.modificado||'').slice(0,10)||d._m;d._por=r.modificado_por||d._por;
      nuevo[r.coleccion].push(d);
    });
    const {data:aj}=await sb.from('ajustes').select('clave,valor').eq('clave','meta').maybeSingle();
    if(aj&&aj.valor)nuevo.meta=Object.assign(nuevo.meta,aj.valor);
    DB=nuevo;
    try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}
    paintOrg();paintSaveState();
    if(!silencioso){buildNav();render()}
  }catch(e){
    if(!silencioso)toast('No se pudo leer del servidor: '+(e.message||e));
  }finally{PULLING=false}
}

async function cloudPush(coleccion,registro){
  if(!CLOUD||!sb)return;
  try{
    const {error}=await sb.from('registros').upsert({id:registro.id,coleccion,datos:registro});
    if(error)throw error;
    sb.from('actividad').insert({usuario:ME,accion:'guardar',coleccion,registro_id:registro.id,
      detalle:(registro.codigo||'')+' '+(registro.titulo||registro.nombre||registro.denominacion||'')}).then(()=>{},()=>{});
  }catch(e){toast('Guardado aquí, pero no en el servidor: '+(e.message||e))}
}

async function cloudDelete(coleccion,id){
  if(!CLOUD||!sb)return;
  try{
    const {error}=await sb.from('registros').delete().eq('id',id);
    if(error)throw error;
    sb.from('actividad').insert({usuario:ME,accion:'eliminar',coleccion,registro_id:id}).then(()=>{},()=>{});
  }catch(e){toast('Eliminado aquí, pero no en el servidor: '+(e.message||e))}
}

async function cloudReplaceAll(){
  if(!CLOUD||!sb)return;
  if(!confirm('Esta operación sustituye TODO el contenido del servidor, para todo el departamento. ¿Continuar?'))return;
  try{
    const filas=[];
    COLLECTIONS.forEach(c=>DB[c].forEach(r=>filas.push({id:r.id,coleccion:c,datos:r})));
    const {error:e1}=await sb.from('registros').delete().neq('id','__ninguno__');
    if(e1)throw e1;
    if(filas.length){
      for(let i=0;i<filas.length;i+=200){
        const {error}=await sb.from('registros').insert(filas.slice(i,i+200));
        if(error)throw error;
      }
    }
    await sb.from('ajustes').upsert({clave:'meta',valor:DB.meta});
    sb.from('actividad').insert({usuario:ME,accion:'sustituir_todo',detalle:filas.length+' registros'}).then(()=>{},()=>{});
    toast('Servidor actualizado: '+filas.length+' registros');
  }catch(e){toast('No se pudo sustituir en el servidor: '+(e.message||e))}
}

async function cloudMeta(){
  if(!CLOUD||!sb)return;
  try{await sb.from('ajustes').upsert({clave:'meta',valor:DB.meta})}catch(e){}
}

async function cerrarSesion(){
  if(!CLOUD||!sb)return;
  await sb.auth.signOut();
  location.reload();
}

/* ---------- indicador de estado ---------- */
function pintarEstadoNube(){
  if(!CLOUD)return;
  const el=document.getElementById('saveState');
  el.innerHTML=`Compartido · ${esc(ME||'')}`;
  el.style.color='';
  if(!document.getElementById('btnSalir')){
    const b=document.createElement('button');
    b.id='btnSalir';b.className='btn sm';b.textContent='Cerrar sesión';b.onclick=cerrarSesion;
    document.querySelector('.side-foot').appendChild(b);
  }
}

/* ---------- arranque ---------- */
async function bootstrap(){
  if(!CLOUD){
    load();initTheme();paintOrg();paintSaveState();buildNav();render();
    return;
  }
  initTheme();
  try{
    await cargarSupabase();
  }catch(e){
    // sin red o CDN bloqueado: se sigue trabajando en local para no dejar a nadie parado
    load();paintOrg();paintSaveState();buildNav();render();avisoSinConexion();
    return;
  }
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  DB=blankDB();

  let session=null;
  try{
    const r=await sb.auth.getSession();session=r.data.session;
  }catch(e){
    load();paintOrg();paintSaveState();buildNav();render();avisoSinConexion();return;
  }
  if(!session){pantallaAcceso();return}
  ME=session.user.email;

  const {data:autorizado,error}=await sb.from('usuarios_autorizados').select('email,rol').maybeSingle();
  if(error||!autorizado){
    await sb.auth.signOut();
    pantallaAcceso('Tu correo no está dado de alta en este departamento. Pídeselo a la dirección del Lab.','err');
    return;
  }

  cerrarAcceso();
  await cloudPull(true);
  paintOrg();pintarEstadoNube();buildNav();render();

  // traer cambios de los demás
  setInterval(()=>{if(!document.hidden&&!$('#drawer').classList.contains('on'))cloudPull(true).then(()=>{if(!$('#drawer').classList.contains('on'))render()})},45000);
  window.addEventListener('focus',()=>{if(!$('#drawer').classList.contains('on'))cloudPull(true).then(()=>render())});
}

/* al volver de un enlace de acceso, Supabase deja el token en el hash */
if(CLOUD&&location.hash.includes('access_token')){
  history.replaceState(null,'',location.pathname+location.search);
}
</script>

function initTheme(){
  const saved=(()=>{try{return localStorage.getItem(KEY+'-theme')}catch(e){return null}})();
  const t=saved||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  setTheme(t);
}
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  $('#btnTheme').textContent=t==='dark'?'Cambiar a modo claro':'Cambiar a modo oscuro';
  try{localStorage.setItem(KEY+'-theme',t)}catch(e){}
}
$('#btnTheme').onclick=()=>setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');

});
